<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 1280 760" width="1280" height="760" role="img" aria-label="Layered vs hexagonal architecture">
  <title>Layered vs hexagonal architecture</title>
  <defs>
    <marker id="arrow-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F3A5F"/>
    </marker>
    <marker id="hollow-navy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="13" markerHeight="13" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L11,6 L1,11 z" fill="#fff" stroke="#1F3A5F" stroke-width="1.5"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2A9D8F"/>
    </marker>
    <marker id="hollow-teal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="13" markerHeight="13" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L11,6 L1,11 z" fill="#fff" stroke="#2A9D8F" stroke-width="1.5"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C8553D"/>
    </marker>
    <marker id="hollow-red" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="13" markerHeight="13" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L11,6 L1,11 z" fill="#fff" stroke="#C8553D" stroke-width="1.5"/>
    </marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5B6B7F"/>
    </marker>
    <marker id="hollow-slate" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="13" markerHeight="13" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L11,6 L1,11 z" fill="#fff" stroke="#5B6B7F" stroke-width="1.5"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#E9A23B"/>
    </marker>
    <marker id="hollow-amber" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="13" markerHeight="13" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L11,6 L1,11 z" fill="#fff" stroke="#E9A23B" stroke-width="1.5"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3C9D5D"/>
    </marker>
    <marker id="hollow-green" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="13" markerHeight="13" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L11,6 L1,11 z" fill="#fff" stroke="#3C9D5D" stroke-width="1.5"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6D5BD0"/>
    </marker>
    <marker id="hollow-purple" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="13" markerHeight="13" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L11,6 L1,11 z" fill="#fff" stroke="#6D5BD0" stroke-width="1.5"/>
    </marker>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1D2733"/>
    </marker>
    <marker id="hollow-ink" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="13" markerHeight="13" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L11,6 L1,11 z" fill="#fff" stroke="#1D2733" stroke-width="1.5"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1D2733" flood-opacity="0.14"/>
    </filter>
  </defs>
  <style>
    text { font-family: Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; white-space: pre; }
    .mono { font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace; }
  </style>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <text x="40" y="48" font-size="26" font-weight="800" fill="#1F3A5F" text-anchor="start"><tspan x="40" dy="0">Layered vs Hexagonal: where do dependencies point?</tspan></text>
  <text x="40" y="76" font-size="15" font-weight="400" fill="#5B6B7F" text-anchor="start"><tspan x="40" dy="0">Same features, different direction of source-code dependencies</tspan></text>
  <line x1="40" y1="92" x2="1240" y2="92" stroke="#C9D3DE" stroke-width="1"/>
  <text x="320" y="135" font-size="18" font-weight="700" fill="#C8553D" text-anchor="middle"><tspan x="320" dy="0">Classic layered (database-centric)</tspan></text>
  <rect x="110" y="160" width="420" height="80" rx="10" fill="#5B6B7F" stroke="none" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="320" y="196.125" font-size="15" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="320" dy="0">Web / Controllers</tspan></text>
  <text x="320" y="213.625" font-size="12.5" font-weight="400" fill="#fff" text-anchor="middle" opacity="0.95"><tspan x="320" dy="0">CaseController, DTOs</tspan></text>
  <line x1="320" y1="242" x2="320" y2="276" stroke="#C8553D" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <rect x="110" y="280" width="420" height="80" rx="10" fill="#5B6B7F" stroke="none" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="320" y="316.125" font-size="15" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="320" dy="0">Service layer</tspan></text>
  <text x="320" y="333.625" font-size="12.5" font-weight="400" fill="#fff" text-anchor="middle" opacity="0.95"><tspan x="320" dy="0">CaseService (rules mixed with plumbing)</tspan></text>
  <line x1="320" y1="362" x2="320" y2="396" stroke="#C8553D" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <rect x="110" y="400" width="420" height="80" rx="10" fill="#5B6B7F" stroke="none" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="320" y="436.125" font-size="15" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="320" dy="0">Data access</tspan></text>
  <text x="320" y="453.625" font-size="12.5" font-weight="400" fill="#fff" text-anchor="middle" opacity="0.95"><tspan x="320" dy="0">CaseDao, JPA @Entity classes</tspan></text>
  <line x1="320" y1="482" x2="320" y2="516" stroke="#C8553D" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <rect x="110" y="520" width="420" height="80" rx="10" fill="#152B47" stroke="none" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="320" y="556.125" font-size="15" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="320" dy="0">Database schema</tspan></text>
  <text x="320" y="573.625" font-size="12.5" font-weight="400" fill="#fff" text-anchor="middle" opacity="0.95"><tspan x="320" dy="0">tables drive the design</tspan></text>
  <rect x="80" y="650" width="480" height="70" rx="8" fill="#FBE9E5" stroke="#C8553D" stroke-width="1.5"/>
  <text x="100" y="677" font-size="13.5" font-weight="400" fill="#1D2733" text-anchor="start"><tspan x="100" dy="0">Business rules depend on persistence. Change the DB or ORM</tspan></text>
  <text x="100" y="699" font-size="13.5" font-weight="400" fill="#1D2733" text-anchor="start"><tspan x="100" dy="0">and the "core" recompiles; tests need a database.</tspan></text>
  <text x="960" y="135" font-size="18" font-weight="700" fill="#2A9D8F" text-anchor="middle"><tspan x="960" dy="0">Hexagonal (domain-centric)</tspan></text>
  <polygon points="1140.0,400.0 1045.0,564.5 855.0,564.5 760.0,400.0 855.0,235.5 1045.0,235.5" fill="#E3F4F1" stroke="#2A9D8F" stroke-width="2.5"/>
  <polygon points="1045.0,400.0 997.5,482.3 902.5,482.3 855.0,400.0 902.5,317.7 997.5,317.7" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="950" y="394" font-size="18" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="950" dy="0">DOMAIN</tspan></text>
  <text x="950" y="416" font-size="13" font-weight="400" fill="#fff" text-anchor="middle"><tspan x="950" dy="0">rules + language</tspan></text>
  <text x="950" y="262" font-size="13.5" font-weight="800" fill="#2A9D8F" text-anchor="middle"><tspan x="950" dy="0">APPLICATION</tspan></text>
  <text x="950" y="280" font-size="12" font-weight="400" fill="#2A9D8F" text-anchor="middle"><tspan x="950" dy="0">use cases + ports</tspan></text>
  <rect x="620" y="226" width="120" height="48" rx="10" fill="#E9A23B" stroke="none" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="680" y="254.225" font-size="13" font-weight="700" fill="#1D2733" text-anchor="middle"><tspan x="680" dy="0">REST adapter</tspan></text>
  <rect x="620" y="526" width="120" height="48" rx="10" fill="#E9A23B" stroke="none" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="680" y="554.225" font-size="13" font-weight="700" fill="#1D2733" text-anchor="middle"><tspan x="680" dy="0">Test harness</tspan></text>
  <rect x="1155" y="226" width="120" height="48" rx="10" fill="#E9A23B" stroke="none" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1215" y="254.225" font-size="13" font-weight="700" fill="#1D2733" text-anchor="middle"><tspan x="1215" dy="0">JDBC adapter</tspan></text>
  <rect x="1155" y="526" width="120" height="48" rx="10" fill="#E9A23B" stroke="none" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1215" y="554.225" font-size="13" font-weight="700" fill="#1D2733" text-anchor="middle"><tspan x="1215" dy="0">Broker adapter</tspan></text>
  <line x1="742" y1="262" x2="812" y2="315" stroke="#2A9D8F" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
  <line x1="742" y1="538" x2="812" y2="485" stroke="#2A9D8F" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
  <line x1="1153" y1="262" x2="1088" y2="315" stroke="#2A9D8F" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#hollow-teal)"/>
  <line x1="1153" y1="538" x2="1088" y2="485" stroke="#2A9D8F" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#hollow-teal)"/>
  <rect x="720" y="650" width="480" height="70" rx="8" fill="#E3F4F1" stroke="#2A9D8F" stroke-width="1.5"/>
  <text x="740" y="677" font-size="13.5" font-weight="400" fill="#1D2733" text-anchor="start"><tspan x="740" dy="0">Every arrow points inward. Swap DB, broker or UI and the</tspan></text>
  <text x="740" y="699" font-size="13.5" font-weight="400" fill="#1D2733" text-anchor="start"><tspan x="740" dy="0">domain does not recompile; tests run in milliseconds.</tspan></text>

</svg>
