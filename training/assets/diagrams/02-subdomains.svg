  <style>
    text { font-family: Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; white-space: pre; }
    .mono { font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace; }
  </style>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <text x="40" y="48" font-size="26" font-weight="800" fill="#1F3A5F" text-anchor="start"><tspan x="40" dy="0">World-Check problem space: subdomains</tspan></text>
  <text x="40" y="76" font-size="15" font-weight="400" fill="#5B6B7F" text-anchor="start"><tspan x="40" dy="0">Invest design effort where the competitive advantage is; buy or reuse the rest</tspan></text>
  <line x1="40" y1="92" x2="1240" y2="92" stroke="#C9D3DE" stroke-width="1"/>
  <rect x="40" y="120" width="390" height="540" rx="14" fill="#EEF2F6" stroke="none" stroke-width="1.5"/>
  <rect x="40" y="120" width="390" height="74" rx="14" fill="#1F3A5F" stroke="none" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="235" y="154.425" font-size="19" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="235" dy="0">CORE</tspan></text>
  <text x="235" y="171.925" font-size="12.5" font-weight="400" fill="#fff" text-anchor="middle" opacity="0.95"><tspan x="235" dy="0">Why clients pay LSEG</tspan></text>
  <rect x="60" y="220" width="350" height="92" rx="10" fill="#fff" stroke="#1F3A5F" stroke-width="2" filter="url(#shadow)"/>
  <text x="235" y="262.2875" font-size="15.5" font-weight="700" fill="#1D2733" text-anchor="middle"><tspan x="235" dy="0">Screening &amp; Matching</tspan></text>
  <text x="235" y="279.7875" font-size="12.5" font-weight="400" fill="#1D2733" text-anchor="middle" opacity="0.95"><tspan x="235" dy="0">name + secondary-ID scoring, false-positive reduction</tspan></text>
  <rect x="60" y="332" width="350" height="92" rx="10" fill="#fff" stroke="#1F3A5F" stroke-width="2" filter="url(#shadow)"/>
  <text x="235" y="374.2875" font-size="15.5" font-weight="700" fill="#1D2733" text-anchor="middle"><tspan x="235" dy="0">Case remediation</tspan></text>
  <text x="235" y="391.7875" font-size="12.5" font-weight="400" fill="#1D2733" text-anchor="middle" opacity="0.95"><tspan x="235" dy="0">resolutions, four-eyes, audit-grade rationale</tspan></text>
  <rect x="60" y="444" width="350" height="92" rx="10" fill="#fff" stroke="#1F3A5F" stroke-width="2" filter="url(#shadow)"/>
  <text x="235" y="486.2875" font-size="15.5" font-weight="700" fill="#1D2733" text-anchor="middle"><tspan x="235" dy="0">Ongoing monitoring</tspan></text>
  <text x="235" y="503.7875" font-size="12.5" font-weight="400" fill="#1D2733" text-anchor="middle" opacity="0.95"><tspan x="235" dy="0">rescreen on corpus change, prioritised alerts</tspan></text>
  <rect x="60" y="566" width="350" height="72" rx="8" fill="#FDF1DC" stroke="#C9D3DE" stroke-width="1.5"/>
  <text x="76" y="592" font-size="12" font-weight="700" fill="#5B6B7F" text-anchor="start"><tspan x="76" dy="0">Strategy</tspan></text>
  <text x="76" y="614" font-size="12.5" font-weight="400" fill="#1D2733" text-anchor="start"><tspan x="76" dy="0">Rich DDD: aggregates, events, best engineers, deep tests</tspan></text>
  <rect x="450" y="120" width="390" height="540" rx="14" fill="#EEF2F6" stroke="none" stroke-width="1.5"/>
  <rect x="450" y="120" width="390" height="74" rx="14" fill="#2A9D8F" stroke="none" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="645" y="154.425" font-size="19" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="645" dy="0">SUPPORTING</tspan></text>
  <text x="645" y="171.925" font-size="12.5" font-weight="400" fill="#fff" text-anchor="middle" opacity="0.95"><tspan x="645" dy="0">Needed, specific to us, not a differentiator</tspan></text>
  <rect x="470" y="220" width="350" height="92" rx="10" fill="#fff" stroke="#2A9D8F" stroke-width="2" filter="url(#shadow)"/>
  <text x="645" y="262.2875" font-size="15.5" font-weight="700" fill="#1D2733" text-anchor="middle"><tspan x="645" dy="0">Batch screening</tspan></text>
  <text x="645" y="279.7875" font-size="12.5" font-weight="400" fill="#1D2733" text-anchor="middle" opacity="0.95"><tspan x="645" dy="0">file ingestion, chunking, replay</tspan></text>
  <rect x="470" y="332" width="350" height="92" rx="10" fill="#fff" stroke="#2A9D8F" stroke-width="2" filter="url(#shadow)"/>
  <text x="645" y="374.2875" font-size="15.5" font-weight="700" fill="#1D2733" text-anchor="middle"><tspan x="645" dy="0">Client &amp; entitlements</tspan></text>
  <text x="645" y="391.7875" font-size="12.5" font-weight="400" fill="#1D2733" text-anchor="middle" opacity="0.95"><tspan x="645" dy="0">client groups, product features, API keys</tspan></text>
  <rect x="470" y="444" width="350" height="92" rx="10" fill="#fff" stroke="#2A9D8F" stroke-width="2" filter="url(#shadow)"/>
  <text x="645" y="486.2875" font-size="15.5" font-weight="700" fill="#1D2733" text-anchor="middle"><tspan x="645" dy="0">Case reporting</tspan></text>
  <text x="645" y="503.7875" font-size="12.5" font-weight="400" fill="#1D2733" text-anchor="middle" opacity="0.95"><tspan x="645" dy="0">exports, evidence packs for regulators</tspan></text>
  <rect x="470" y="566" width="350" height="72" rx="8" fill="#fff" stroke="#C9D3DE" stroke-width="1.5"/>
  <text x="486" y="592" font-size="12" font-weight="700" fill="#5B6B7F" text-anchor="start"><tspan x="486" dy="0">Strategy</tspan></text>
  <text x="486" y="614" font-size="12.5" font-weight="400" fill="#1D2733" text-anchor="start"><tspan x="486" dy="0">Simpler models; CRUD is fine where rules are thin</tspan></text>
  <rect x="860" y="120" width="390" height="540" rx="14" fill="#EEF2F6" stroke="none" stroke-width="1.5"/>
  <rect x="860" y="120" width="390" height="74" rx="14" fill="#5B6B7F" stroke="none" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1055" y="154.425" font-size="19" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="1055" dy="0">GENERIC</tspan></text>
  <text x="1055" y="171.925" font-size="12.5" font-weight="400" fill="#fff" text-anchor="middle" opacity="0.95"><tspan x="1055" dy="0">Solved problems; buy or reuse</tspan></text>
  <rect x="880" y="220" width="350" height="92" rx="10" fill="#fff" stroke="#5B6B7F" stroke-width="2" filter="url(#shadow)"/>
  <text x="1055" y="262.2875" font-size="15.5" font-weight="700" fill="#1D2733" text-anchor="middle"><tspan x="1055" dy="0">Identity &amp; SSO</tspan></text>
  <text x="1055" y="279.7875" font-size="12.5" font-weight="400" fill="#1D2733" text-anchor="middle" opacity="0.95"><tspan x="1055" dy="0">OIDC provider, MFA</tspan></text>
  <rect x="880" y="332" width="350" height="92" rx="10" fill="#fff" stroke="#5B6B7F" stroke-width="2" filter="url(#shadow)"/>
  <text x="1055" y="374.2875" font-size="15.5" font-weight="700" fill="#1D2733" text-anchor="middle"><tspan x="1055" dy="0">Notifications</tspan></text>
  <text x="1055" y="391.7875" font-size="12.5" font-weight="400" fill="#1D2733" text-anchor="middle" opacity="0.95"><tspan x="1055" dy="0">email / webhook delivery</tspan></text>
  <rect x="880" y="444" width="350" height="92" rx="10" fill="#fff" stroke="#5B6B7F" stroke-width="2" filter="url(#shadow)"/>
  <text x="1055" y="486.2875" font-size="15.5" font-weight="700" fill="#1D2733" text-anchor="middle"><tspan x="1055" dy="0">Billing &amp; usage metering</tspan></text>
  <text x="1055" y="503.7875" font-size="12.5" font-weight="400" fill="#1D2733" text-anchor="middle" opacity="0.95"><tspan x="1055" dy="0">off-the-shelf or platform team</tspan></text>
  <rect x="880" y="566" width="350" height="72" rx="8" fill="#fff" stroke="#C9D3DE" stroke-width="1.5"/>
  <text x="896" y="592" font-size="12" font-weight="700" fill="#5B6B7F" text-anchor="start"><tspan x="896" dy="0">Strategy</tspan></text>
  <text x="896" y="614" font-size="12.5" font-weight="400" fill="#1D2733" text-anchor="start"><tspan x="896" dy="0">Integrate through an ACL; never let their model leak in</tspan></text>

</svg>
