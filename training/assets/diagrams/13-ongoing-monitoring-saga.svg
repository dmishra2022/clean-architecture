  <text x="1075" y="458.16" font-size="12.8" font-weight="700" fill="#1D2733" text-anchor="middle"><tspan x="1075" dy="0">CaseScreened</tspan><tspan x="1075" dy="16">(newMatches = 1)</tspan></text>
  <circle cx="980" cy="420" r="13" fill="#1F3A5F"/>
  <text x="980" y="424.5" font-size="12.5" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="980" dy="0">5</tspan></text>
