  <text x="145" y="466.55" font-size="14" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="145" dy="0">Screening &amp; Case</tspan></text>
  <rect x="40" y="540" width="1240" height="124" rx="8" fill="#EEF2F6" stroke="#C9D3DE" stroke-width="1.5"/>
  <rect x="40" y="540" width="210" height="124" rx="8" fill="#5B6B7F" stroke="none" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="145" y="606.55" font-size="14" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="145" dy="0">Notifications</tspan></text>
