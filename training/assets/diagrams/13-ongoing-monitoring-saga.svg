  <text x="385" y="178.16" font-size="12.8" font-weight="700" fill="#1D2733" text-anchor="middle"><tspan x="385" dy="0">ProfileUpdated</tspan><tspan x="385" dy="16">(WC-1001 new alias)</tspan></text>
  <circle cx="290" cy="140" r="13" fill="#2A9D8F"/>
  <text x="290" y="144.5" font-size="12.5" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="290" dy="0">1</tspan></text>
  <rect x="520" y="280" width="190" height="84" rx="10" fill="#fff" stroke="#6D5BD0" stroke-width="2.2" filter="url(#shadow)"/>
  <text x="615" y="318.16" font-size="12.8" font-weight="700" fill="#1D2733" text-anchor="middle"><tspan x="615" dy="0">Find open cases</tspan><tspan x="615" dy="16">matching profile</tspan></text>
  <circle cx="520" cy="280" r="13" fill="#6D5BD0"/>
  <text x="520" y="284.5" font-size="12.5" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="520" dy="0">2</tspan></text>
  <rect x="750" y="280" width="190" height="84" rx="10" fill="#fff" stroke="#6D5BD0" stroke-width="2.2" filter="url(#shadow)"/>
  <text x="845" y="318.16" font-size="12.8" font-weight="700" fill="#1D2733" text-anchor="middle"><tspan x="845" dy="0">for each case:</tspan><tspan x="845" dy="16">send RescreenCase</tspan></text>
  <circle cx="750" cy="280" r="13" fill="#6D5BD0"/>
  <text x="750" y="284.5" font-size="12.5" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="750" dy="0">3</tspan></text>
  <rect x="750" y="420" width="190" height="84" rx="10" fill="#fff" stroke="#1F3A5F" stroke-width="2.2" filter="url(#shadow)"/>
  <text x="845" y="458.16" font-size="12.8" font-weight="700" fill="#1D2733" text-anchor="middle"><tspan x="845" dy="0">ScreenCaseUseCase</tspan><tspan x="845" dy="16">(same port as REST)</tspan></text>
  <circle cx="750" cy="420" r="13" fill="#1F3A5F"/>
  <text x="750" y="424.5" font-size="12.5" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="750" dy="0">4</tspan></text>
