  <line x1="942" y1="462" x2="978" y2="462" stroke="#1F3A5F" stroke-width="2.2" marker-end="url(#arrow-navy)"/>
  <line x1="1075" y1="418" x2="1075" y2="366" stroke="#1F3A5F" stroke-width="2.2" marker-end="url(#arrow-navy)"/>
  <line x1="1120" y1="366" x2="1150" y2="558" stroke="#6D5BD0" stroke-width="2.2" marker-end="url(#arrow-purple)"/>
  <rect x="40" y="690" width="1240" height="50" rx="8" fill="#FDF1DC" stroke="none" stroke-width="1.5"/>
  <text x="60" y="721" font-size="13" font-weight="400" fill="#1D2733" text-anchor="start"><tspan x="60" dy="0">Rules: one aggregate per transaction · commands are idempotent (caseId + profile version) · the process manager keeps its own state, never edits a ScreeningCase directly.</tspan></text>

