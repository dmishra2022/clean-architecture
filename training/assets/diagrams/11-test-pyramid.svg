<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 1280 760" width="1280" height="760" role="img" aria-label="Test pyramid">
  <title>Test pyramid</title>
  <defs>
    <marker id="arrow-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F3A5F"/>
    </marker>
    <marker id="hollow-navy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="13" markerHeight="13" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L11,6 L1,11 z" fill="#fff" stroke="#1F3A5F" stroke-width="1.5"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2A9D8F"/>
    </marker>
    <marker id="hollow-teal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="13" markerHeight="13" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L11,6 L1,11 z" fill="#fff" stroke="#2A9D8F" stroke-width="1.5"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C8553D"/>
    </marker>
    <marker id="hollow-red" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="13" markerHeight="13" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L11,6 L1,11 z" fill="#fff" stroke="#C8553D" stroke-width="1.5"/>
    </marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5B6B7F"/>
    </marker>
    <marker id="hollow-slate" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="13" markerHeight="13" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L11,6 L1,11 z" fill="#fff" stroke="#5B6B7F" stroke-width="1.5"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#E9A23B"/>
    </marker>
    <marker id="hollow-amber" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="13" markerHeight="13" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L11,6 L1,11 z" fill="#fff" stroke="#E9A23B" stroke-width="1.5"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3C9D5D"/>
    </marker>
    <marker id="hollow-green" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="13" markerHeight="13" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L11,6 L1,11 z" fill="#fff" stroke="#3C9D5D" stroke-width="1.5"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6D5BD0"/>
    </marker>
    <marker id="hollow-purple" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="13" markerHeight="13" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L11,6 L1,11 z" fill="#fff" stroke="#6D5BD0" stroke-width="1.5"/>
    </marker>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1D2733"/>
    </marker>
    <marker id="hollow-ink" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="13" markerHeight="13" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L11,6 L1,11 z" fill="#fff" stroke="#1D2733" stroke-width="1.5"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1D2733" flood-opacity="0.14"/>
    </filter>
  </defs>
  <style>
    text { font-family: Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; white-space: pre; }
    .mono { font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace; }
  </style>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <text x="40" y="48" font-size="26" font-weight="800" fill="#1F3A5F" text-anchor="start"><tspan x="40" dy="0">Testing strategy per ring</tspan></text>
  <text x="40" y="76" font-size="15" font-weight="400" fill="#5B6B7F" text-anchor="start"><tspan x="40" dy="0">Most confidence from the cheapest tests; the hexagon is what makes them cheap</tspan></text>
  <line x1="40" y1="92" x2="1240" y2="92" stroke="#C9D3DE" stroke-width="1"/>
  <polygon points="380,130 580,130 670,258 290,258" fill="#5B6B7F" filter="url(#shadow)"/>
  <text x="480" y="186" font-size="16" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="480" dy="0">E2E / consumer contracts</tspan></text>
  <text x="480" y="212" font-size="12.5" font-weight="400" fill="#fff" text-anchor="middle"><tspan x="480" dy="0">Pact / OpenAPI diff · few staging journeys</tspan></text>
  <polygon points="290,270 670,270 760,398 200,398" fill="#E9A23B" filter="url(#shadow)"/>
  <text x="480" y="326" font-size="16" font-weight="800" fill="#1D2733" text-anchor="middle"><tspan x="480" dy="0">Adapter integration – @MicronautTest</tspan></text>
  <text x="480" y="352" font-size="12.5" font-weight="400" fill="#1D2733" text-anchor="middle"><tspan x="480" dy="0">CaseApiTest (HTTP), JdbcCaseRepositoryTest (H2 + Flyway) · 8 tests · ~2 s</tspan></text>
  <polygon points="200,410 760,410 850,538 110,538" fill="#2A9D8F" filter="url(#shadow)"/>
  <text x="480" y="466" font-size="16" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="480" dy="0">Application – fakes for every port</tspan></text>
  <text x="480" y="492" font-size="12.5" font-weight="400" fill="#fff" text-anchor="middle"><tspan x="480" dy="0">CaseApplicationServiceTest · 6 tests · ms · no framework</tspan></text>
  <polygon points="110,550 850,550 940,678 20,678" fill="#1F3A5F" filter="url(#shadow)"/>
  <text x="480" y="606" font-size="16" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="480" dy="0">Domain unit tests</tspan></text>
  <text x="480" y="632" font-size="12.5" font-weight="400" fill="#fff" text-anchor="middle"><tspan x="480" dy="0">ScreeningCaseTest, NameMatchingPolicyTest · 27 tests · ms · pure Java</tspan></text>
  <rect x="1010" y="130" width="240" height="548" rx="14" fill="#6D5BD0" stroke="none" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1130" y="175" font-size="17" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="1130" dy="0">Architecture</tspan></text>
  <text x="1130" y="198" font-size="17" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="1130" dy="0">tests (ArchUnit)</tspan></text>
  <text x="1030" y="240" font-size="13" font-weight="400" fill="#fff" text-anchor="start"><tspan x="1030" dy="0">5 rules, every build:</tspan></text>
  <text x="1030" y="264" font-size="13" font-weight="400" fill="#fff" text-anchor="start"><tspan x="1030" dy="0"></tspan></text>
  <text x="1030" y="288" font-size="13" font-weight="400" fill="#fff" text-anchor="start"><tspan x="1030" dy="0">• dependencies point</tspan></text>
  <text x="1030" y="312" font-size="13" font-weight="400" fill="#fff" text-anchor="start"><tspan x="1030" dy="0">  inwards (onion rule)</tspan></text>
  <text x="1030" y="336" font-size="13" font-weight="400" fill="#fff" text-anchor="start"><tspan x="1030" dy="0">• domain: plain Java</tspan></text>
  <text x="1030" y="360" font-size="13" font-weight="400" fill="#fff" text-anchor="start"><tspan x="1030" dy="0">• application: plain Java</tspan></text>
  <text x="1030" y="384" font-size="13" font-weight="400" fill="#fff" text-anchor="start"><tspan x="1030" dy="0">• adapters call ports,</tspan></text>
  <text x="1030" y="408" font-size="13" font-weight="400" fill="#fff" text-anchor="start"><tspan x="1030" dy="0">  never the service</tspan></text>
  <text x="1030" y="432" font-size="13" font-weight="400" fill="#fff" text-anchor="start"><tspan x="1030" dy="0">• only storage adapters</tspan></text>
  <text x="1030" y="456" font-size="13" font-weight="400" fill="#fff" text-anchor="start"><tspan x="1030" dy="0">  touch Micronaut Data</tspan></text>
  <text x="40" y="724" font-size="14" font-weight="700" fill="#1F3A5F" text-anchor="start" class="mono"><tspan x="40" dy="0">Run all 46: cd plan/training/code-lab &amp;&amp; ../../../mvnw test</tspan></text>

</svg>
