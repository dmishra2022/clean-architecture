<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 1360 980" width="1360" height="980" role="img" aria-label="Request sequence diagram">
  <title>Request sequence diagram</title>
  <defs>
    <marker id="arrow-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F3A5F"/>
    </marker>
    <marker id="hollow-navy" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="13" markerHeight="13" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L11,6 L1,11 z" fill="#fff" stroke="#1F3A5F" stroke-width="1.5"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2A9D8F"/>
    </marker>
    <marker id="hollow-teal" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="13" markerHeight="13" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L11,6 L1,11 z" fill="#fff" stroke="#2A9D8F" stroke-width="1.5"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C8553D"/>
    </marker>
    <marker id="hollow-red" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="13" markerHeight="13" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L11,6 L1,11 z" fill="#fff" stroke="#C8553D" stroke-width="1.5"/>
    </marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5B6B7F"/>
    </marker>
    <marker id="hollow-slate" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="13" markerHeight="13" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L11,6 L1,11 z" fill="#fff" stroke="#5B6B7F" stroke-width="1.5"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#E9A23B"/>
    </marker>
    <marker id="hollow-amber" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="13" markerHeight="13" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L11,6 L1,11 z" fill="#fff" stroke="#E9A23B" stroke-width="1.5"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3C9D5D"/>
    </marker>
    <marker id="hollow-green" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="13" markerHeight="13" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L11,6 L1,11 z" fill="#fff" stroke="#3C9D5D" stroke-width="1.5"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6D5BD0"/>
    </marker>
    <marker id="hollow-purple" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="13" markerHeight="13" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L11,6 L1,11 z" fill="#fff" stroke="#6D5BD0" stroke-width="1.5"/>
    </marker>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1D2733"/>
    </marker>
    <marker id="hollow-ink" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="13" markerHeight="13" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L11,6 L1,11 z" fill="#fff" stroke="#1D2733" stroke-width="1.5"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1D2733" flood-opacity="0.14"/>
    </filter>
  </defs>
  <style>
    text { font-family: Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; white-space: pre; }
    .mono { font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace; }
  </style>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <text x="40" y="48" font-size="26" font-weight="800" fill="#1F3A5F" text-anchor="start"><tspan x="40" dy="0">One request end to end: PUT …/matches/{id}/resolution</tspan></text>
  <text x="40" y="76" font-size="15" font-weight="400" fill="#5B6B7F" text-anchor="start"><tspan x="40" dy="0">Who does what, in which ring, inside which transaction</tspan></text>
  <line x1="40" y1="92" x2="1320" y2="92" stroke="#C9D3DE" stroke-width="1"/>
  <rect x="32" y="112" width="176" height="44" rx="10" fill="#5B6B7F" stroke="none" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="120" y="138.0625" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="120" dy="0">Client</tspan></text>
  <line x1="120" y1="158" x2="120" y2="900" stroke="#C9D3DE" stroke-width="1.5" stroke-dasharray="4 5"/>
  <rect x="202" y="112" width="176" height="44" rx="10" fill="#E9A23B" stroke="none" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="290" y="138.0625" font-size="12.5" font-weight="700" fill="#1D2733" text-anchor="middle"><tspan x="290" dy="0">CaseController</tspan></text>
  <line x1="290" y1="158" x2="290" y2="900" stroke="#C9D3DE" stroke-width="1.5" stroke-dasharray="4 5"/>
  <rect x="402" y="112" width="176" height="44" rx="10" fill="#2A9D8F" stroke="none" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="490" y="138.0625" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="490" dy="0">CaseApplicationService</tspan></text>
  <line x1="490" y1="158" x2="490" y2="900" stroke="#C9D3DE" stroke-width="1.5" stroke-dasharray="4 5"/>
  <rect x="592" y="112" width="176" height="44" rx="10" fill="#E9A23B" stroke="none" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="680" y="138.0625" font-size="12.5" font-weight="700" fill="#1D2733" text-anchor="middle"><tspan x="680" dy="0">JdbcUnitOfWork</tspan></text>
  <line x1="680" y1="158" x2="680" y2="900" stroke="#C9D3DE" stroke-width="1.5" stroke-dasharray="4 5"/>
  <rect x="782" y="112" width="176" height="44" rx="10" fill="#E9A23B" stroke="none" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="870" y="138.0625" font-size="12.5" font-weight="700" fill="#1D2733" text-anchor="middle"><tspan x="870" dy="0">JdbcCaseRepository</tspan></text>
  <line x1="870" y1="158" x2="870" y2="900" stroke="#C9D3DE" stroke-width="1.5" stroke-dasharray="4 5"/>
  <rect x="972" y="112" width="176" height="44" rx="10" fill="#1F3A5F" stroke="none" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1060" y="138.0625" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="1060" dy="0">ScreeningCase</tspan></text>
  <line x1="1060" y1="158" x2="1060" y2="900" stroke="#C9D3DE" stroke-width="1.5" stroke-dasharray="4 5"/>
  <rect x="1162" y="112" width="176" height="44" rx="10" fill="#E9A23B" stroke="none" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1250" y="138.0625" font-size="12.5" font-weight="700" fill="#1D2733" text-anchor="middle"><tspan x="1250" dy="0">OutboxEventAppender</tspan></text>
  <line x1="1250" y1="158" x2="1250" y2="900" stroke="#C9D3DE" stroke-width="1.5" stroke-dasharray="4 5"/>
  <rect x="470" y="300" width="870" height="400" rx="8" fill="rgba(42,157,143,0.07)" stroke="#2A9D8F" stroke-width="1.5" stroke-dasharray="8 5"/>
  <text x="1330" y="318" font-size="12" font-weight="700" fill="#2A9D8F" text-anchor="end"><tspan x="1330" dy="0">one DB transaction</tspan></text>
  <line x1="120" y1="190" x2="286" y2="190" stroke="#1F3A5F" stroke-width="2" marker-end="url(#arrow-navy)"/>
  <text x="205" y="183" font-size="12" font-weight="400" fill="#1D2733" text-anchor="middle" class="mono"><tspan x="205" dy="0">PUT {resolution, rationale, analystId}</tspan></text>
  <path d="M290,224 h34 v20 h-30" fill="none" stroke="#5B6B7F" stroke-width="1.6" marker-end="url(#arrow-slate)"/>
  <rect x="330" y="223" width="323" height="22" rx="6" fill="#fff" stroke="#C9D3DE" stroke-width="1"/>
  <text x="338" y="238" font-size="12" font-weight="400" fill="#1D2733" text-anchor="start"><tspan x="338" dy="0">@Valid DTO → value objects → ResolveMatchCommand</tspan></text>
  <line x1="290" y1="278" x2="486" y2="278" stroke="#1F3A5F" stroke-width="2" marker-end="url(#arrow-navy)"/>
  <text x="390" y="271" font-size="12" font-weight="400" fill="#1D2733" text-anchor="middle" class="mono"><tspan x="390" dy="0">resolveMatch.resolve(cmd)   «port.in»</tspan></text>
  <line x1="490" y1="322" x2="676" y2="322" stroke="#1F3A5F" stroke-width="2" marker-end="url(#arrow-navy)"/>
  <text x="585" y="315" font-size="12" font-weight="400" fill="#1D2733" text-anchor="middle" class="mono"><tspan x="585" dy="0">write(() -&gt; …)  BEGIN</tspan></text>
  <line x1="490" y1="366" x2="866" y2="366" stroke="#1F3A5F" stroke-width="2" marker-end="url(#arrow-navy)"/>
  <text x="680" y="359" font-size="12" font-weight="400" fill="#1D2733" text-anchor="middle" class="mono"><tspan x="680" dy="0">findById(caseId)   «port.out»</tspan></text>
  <line x1="870" y1="410" x2="494" y2="410" stroke="#5B6B7F" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-slate)"/>
  <text x="680" y="403" font-size="12" font-weight="400" fill="#1D2733" text-anchor="middle" class="mono"><tspan x="680" dy="0">rehydrate(snapshot)  [SELECT case + matches]</tspan></text>
  <path d="M490,444 h34 v20 h-30" fill="none" stroke="#5B6B7F" stroke-width="1.6" marker-end="url(#arrow-slate)"/>
  <rect x="530" y="443" width="317" height="22" rx="6" fill="#fff" stroke="#C9D3DE" stroke-width="1"/>
  <text x="538" y="458" font-size="12" font-weight="400" fill="#1D2733" text-anchor="start"><tspan x="538" dy="0">belongsTo(clientGroup)? else CaseNotFound (404)</tspan></text>
  <line x1="490" y1="498" x2="1056" y2="498" stroke="#1F3A5F" stroke-width="2" marker-end="url(#arrow-navy)"/>
  <text x="775" y="491" font-size="12" font-weight="400" fill="#1D2733" text-anchor="middle" class="mono"><tspan x="775" dy="0">resolveMatch(matchId, POSITIVE, rationale, analyst, now)</tspan></text>
  <path d="M1060,532 h-34 v20 h30" fill="none" stroke="#5B6B7F" stroke-width="1.6" marker-end="url(#arrow-slate)"/>
  <rect x="612" y="531" width="406" height="22" rx="6" fill="#fff" stroke="#C9D3DE" stroke-width="1"/>
  <text x="620" y="546" font-size="12" font-weight="400" fill="#1F3A5F" text-anchor="start"><tspan x="620" dy="0">invariants: open? rationale? four-eyes? → raise MatchResolved</tspan></text>
  <line x1="490" y1="586" x2="866" y2="586" stroke="#1F3A5F" stroke-width="2" marker-end="url(#arrow-navy)"/>
  <text x="680" y="579" font-size="12" font-weight="400" fill="#1D2733" text-anchor="middle" class="mono"><tspan x="680" dy="0">save(case)  UPDATE … WHERE version = ?</tspan></text>
  <line x1="490" y1="630" x2="1246" y2="630" stroke="#1F3A5F" stroke-width="2" marker-end="url(#arrow-navy)"/>
  <text x="870" y="623" font-size="12" font-weight="400" fill="#1D2733" text-anchor="middle" class="mono"><tspan x="870" dy="0">append(case.pullEvents())  INSERT outbox_event</tspan></text>
  <path d="M680,664 h34 v20 h-30" fill="none" stroke="#5B6B7F" stroke-width="1.6" marker-end="url(#arrow-slate)"/>
  <rect x="720" y="663" width="259" height="22" rx="6" fill="#fff" stroke="#C9D3DE" stroke-width="1"/>
  <text x="728" y="678" font-size="12" font-weight="400" fill="#2A9D8F" text-anchor="start"><tspan x="728" dy="0">COMMIT  (or ROLLBACK on any exception)</tspan></text>
  <line x1="490" y1="724" x2="294" y2="724" stroke="#5B6B7F" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-slate)"/>
  <text x="390" y="717" font-size="12" font-weight="400" fill="#1D2733" text-anchor="middle" class="mono"><tspan x="390" dy="0">CaseView</tspan></text>
  <line x1="290" y1="768" x2="124" y2="768" stroke="#5B6B7F" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-slate)"/>
  <text x="205" y="761" font-size="12" font-weight="400" fill="#1D2733" text-anchor="middle" class="mono"><tspan x="205" dy="0">200 CaseResponse (application/json)</tspan></text>
  <rect x="40" y="790" width="640" height="160" rx="10" fill="#FBE9E5" stroke="none" stroke-width="1.5"/>
  <text x="60" y="818" font-size="14" font-weight="700" fill="#C8553D" text-anchor="start"><tspan x="60" dy="0">Failure paths</tspan></text>
  <text x="60" y="846" font-size="12.8" font-weight="400" fill="#1D2733" text-anchor="start" class="mono"><tspan x="60" dy="0">DomainException (rule) → ROLLBACK → 422 problem+json {rule}</tspan></text>
  <text x="60" y="871" font-size="12.8" font-weight="400" fill="#1D2733" text-anchor="start" class="mono"><tspan x="60" dy="0">DomainException (INVALID_VALUE) → 400</tspan></text>
  <text x="60" y="896" font-size="12.8" font-weight="400" fill="#1D2733" text-anchor="start" class="mono"><tspan x="60" dy="0">OptimisticLockException → ConcurrentCaseUpdateException → 409</tspan></text>
  <text x="60" y="921" font-size="12.8" font-weight="400" fill="#1D2733" text-anchor="start" class="mono"><tspan x="60" dy="0">Bean Validation on DTO → 400 before the core is touched</tspan></text>
  <rect x="700" y="790" width="620" height="160" rx="10" fill="#ECE9FB" stroke="none" stroke-width="1.5"/>
  <text x="720" y="818" font-size="14" font-weight="700" fill="#6D5BD0" text-anchor="start"><tspan x="720" dy="0">Later, asynchronously</tspan></text>
  <text x="720" y="846" font-size="12.8" font-weight="400" fill="#1D2733" text-anchor="start" class="mono"><tspan x="720" dy="0">OutboxRelay @Scheduled(fixedDelay = 2s)</tspan></text>
  <text x="720" y="871" font-size="12.8" font-weight="400" fill="#1D2733" text-anchor="start" class="mono"><tspan x="720" dy="0">  SELECT … WHERE published_at IS NULL ORDER BY occurred_at</tspan></text>
  <text x="720" y="896" font-size="12.8" font-weight="400" fill="#1D2733" text-anchor="start" class="mono"><tspan x="720" dy="0">  IntegrationEventSink.publish(event)   (log / Kafka)</tspan></text>
  <text x="720" y="921" font-size="12.8" font-weight="400" fill="#1D2733" text-anchor="start" class="mono"><tspan x="720" dy="0">  UPDATE outbox_event SET published_at = now()</tspan></text>

</svg>
