  <rect x="30" y="745" width="1245" height="54" rx="10" fill="#ECE9FB" stroke="#6D5BD0" stroke-width="1.5"/>
  <text x="50" y="778" font-size="13.5" font-weight="600" fill="#1D2733" text-anchor="start"><tspan x="50" dy="0">config.ApplicationWiring (@Factory) – composition root: builds CaseApplicationService and lets Micronaut plug the selected adapters into its ports.</tspan></text>
