  <polygon points="950.0,440.0 800.0,699.8 500.0,699.8 350.0,440.0 500.0,180.2 800.0,180.2" fill="#E3F4F1" stroke="#2A9D8F" stroke-width="3"/>
  <polygon points="778.0,440.0 714.0,550.9 586.0,550.9 522.0,440.0 586.0,329.1 714.0,329.1" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="650" y="410" font-size="20" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="650" dy="0">DOMAIN</tspan></text>
  <text x="650" y="436" font-size="12.5" font-weight="400" fill="#fff" text-anchor="middle"><tspan x="650" dy="0">ScreeningCase · Match</tspan></text>
  <text x="650" y="456" font-size="12.5" font-weight="400" fill="#fff" text-anchor="middle"><tspan x="650" dy="0">Party · MatchScore</tspan></text>
  <text x="650" y="476" font-size="12.5" font-weight="400" fill="#fff" text-anchor="middle"><tspan x="650" dy="0">NameMatchingPolicy</tspan></text>
  <text x="650" y="496" font-size="12.5" font-weight="400" fill="#fff" text-anchor="middle"><tspan x="650" dy="0">CaseOpened … CaseClosed</tspan></text>
  <text x="650" y="200" font-size="16" font-weight="800" fill="#2A9D8F" text-anchor="middle"><tspan x="650" dy="0">APPLICATION</tspan></text>
  <text x="650" y="222" font-size="12.5" font-weight="400" fill="#1D2733" text-anchor="middle"><tspan x="650" dy="0">CaseApplicationService: load → tenant check → domain call → save → outbox</tspan></text>
  <text x="650" y="684" font-size="12.5" font-weight="400" fill="#5B6B7F" text-anchor="middle" font-style="italic"><tspan x="650" dy="0">plain Java – no framework imports (enforced by ArchUnit)</tspan></text>
