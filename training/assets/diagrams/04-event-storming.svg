  <rect x="346" y="140" width="112" height="91.83999999999999" fill="#FFE066" filter="url(#shadow)"/>
  <text x="402" y="182.6075" font-size="12.5" font-weight="600" fill="#1D2733" text-anchor="middle"><tspan x="402" dy="0">Screening</tspan><tspan x="402" dy="15.625">Case</tspan></text>
  </g>
  <line x1="460" y1="185.92" x2="492" y2="185.92" stroke="#5B6B7F" stroke-width="1.6" marker-end="url(#arrow-slate)"/>
  <g transform="rotate(1 550 185.92)">
  <rect x="494" y="140" width="112" height="91.83999999999999" fill="#F4A261" filter="url(#shadow)"/>
  <text x="550" y="182.6075" font-size="12.5" font-weight="600" fill="#1D2733" text-anchor="middle"><tspan x="550" dy="0">Case</tspan><tspan x="550" dy="15.625">Opened</tspan></text>
  </g>
  <line x1="608" y1="185.92" x2="640" y2="185.92" stroke="#5B6B7F" stroke-width="1.6" marker-end="url(#arrow-slate)"/>
  <g transform="rotate(-1 698 185.92)">
  <rect x="642" y="140" width="112" height="91.83999999999999" fill="#C3AED6" filter="url(#shadow)"/>
  <text x="698" y="182.6075" font-size="12.5" font-weight="600" fill="#1D2733" text-anchor="middle"><tspan x="698" dy="0">Whenever opened</tspan><tspan x="698" dy="15.625">→ screen it</tspan></text>
  </g>
  <line x1="756" y1="185.92" x2="788" y2="185.92" stroke="#5B6B7F" stroke-width="1.6" marker-end="url(#arrow-slate)"/>
  <g transform="rotate(1 846 185.92)">
  <rect x="790" y="140" width="112" height="91.83999999999999" fill="#7EC8E3" filter="url(#shadow)"/>
  <text x="846" y="182.6075" font-size="12.5" font-weight="600" fill="#1D2733" text-anchor="middle"><tspan x="846" dy="0">Screen</tspan><tspan x="846" dy="15.625">case</tspan></text>
  </g>
  <line x1="904" y1="185.92" x2="936" y2="185.92" stroke="#5B6B7F" stroke-width="1.6" marker-end="url(#arrow-slate)"/>
