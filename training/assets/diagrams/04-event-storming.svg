  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <text x="40" y="48" font-size="26" font-weight="800" fill="#1F3A5F" text-anchor="start"><tspan x="40" dy="0">Event Storming: screening a party (process level)</tspan></text>
  <text x="40" y="76" font-size="15" font-weight="400" fill="#5B6B7F" text-anchor="start"><tspan x="40" dy="0">Read left to right. Orange = what happened. Everything else explains why and who.</tspan></text>
  <line x1="40" y1="92" x2="1360" y2="92" stroke="#C9D3DE" stroke-width="1"/>
  <line x1="50" y1="300" x2="1350" y2="300" stroke="#1D2733" stroke-width="2" marker-end="url(#arrow-ink)"/>
  <text x="1350" y="290" font-size="13" font-weight="700" fill="#5B6B7F" text-anchor="end"><tspan x="1350" dy="0">time →</tspan></text>
  <g transform="rotate(-1 106 185.92)">
