  <text x="106" y="182.6075" font-size="12.5" font-weight="600" fill="#1D2733" text-anchor="middle"><tspan x="106" dy="0">Onboarding</tspan><tspan x="106" dy="15.625">analyst</tspan></text>
  </g>
