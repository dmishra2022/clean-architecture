micronaut:
  application:
    name: screening-case-service
  server:
    port: 8080
  http:
    services:
      reference-data:
        url: http://localhost:9090
        read-timeout: 2s

datasources:
  default:
    url: jdbc:h2:mem:screening;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
    dialect: H2

flyway:
  datasources:
    default:
      enabled: true

screening:
  matching:
    threshold: 80
  reference-data:
    mode: in-memory        # in-memory | http  (swaps the driven adapter, core unchanged)
  events:
    sink: log
  outbox:
    relay-interval: 2s
    initial-delay: 2s

endpoints:
  health:
    enabled: true
    details-visible: ANONYMOUS
