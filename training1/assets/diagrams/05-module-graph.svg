  <style>
    text { font-family: Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; white-space: pre; }
    .mono { font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace; }
  </style>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <text x="40" y="48" font-size="26" font-weight="800" fill="#1F3A5F" text-anchor="start"><tspan x="40" dy="0">The code lab as a component graph</tspan></text>
  <text x="40" y="76" font-size="15" font-weight="400" fill="#5B6B7F" text-anchor="start"><tspan x="40" dy="0">Four Maven modules, one per ring. Arrows are &lt;dependency&gt; entries; only screening-app sees a framework.</tspan></text>
  <line x1="40" y1="92" x2="1240" y2="92" stroke="#C9D3DE" stroke-width="1"/>
  <rect x="250" y="130" width="620" height="120" rx="12" fill="#E2EDF7" stroke="#3E7CB1" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="270" y="158" font-size="17" font-weight="800" fill="#1F4E79" text-anchor="start" class="mono"><tspan x="270" dy="0">screening-app</tspan></text>
  <text x="850" y="158" font-size="12.5" font-weight="700" fill="#1F4E79" text-anchor="end"><tspan x="850" dy="0">Ca 0 · Ce 3 · I 1.00 · A 0.20</tspan></text>
  <text x="270" y="186" font-size="12.5" font-weight="400" fill="#1D2733" text-anchor="start" class="mono"><tspan x="270" dy="0">CaseEndpoint, WorkQueueEndpoint, MalformedBodyHandler</tspan></text>
  <text x="270" y="207" font-size="12.5" font-weight="400" fill="#1D2733" text-anchor="start" class="mono"><tspan x="270" dy="0">Micronaut*Records, JdbcIdempotencyGateway, JdbcWorkQueueGateway</tspan></text>
  <text x="270" y="228" font-size="12.5" font-weight="400" fill="#1D2733" text-anchor="start" class="mono"><tspan x="270" dy="0">ScheduledOutboxRelay, LoggingEventSink, MainWiring</tspan></text>
  <rect x="250" y="290" width="620" height="120" rx="12" fill="#E6F3E4" stroke="#5FAD56" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="270" y="318" font-size="17" font-weight="800" fill="#2F6B28" text-anchor="start" class="mono"><tspan x="270" dy="0">screening-interface-adapters</tspan></text>
  <text x="850" y="318" font-size="12.5" font-weight="700" fill="#2F6B28" text-anchor="end"><tspan x="850" dy="0">Ca 1 · Ce 2 · I 0.67 · A 0.13</tspan></text>
  <text x="270" y="346" font-size="12.5" font-weight="400" fill="#1D2733" text-anchor="start" class="mono"><tspan x="270" dy="0">web: CaseController, CasePresenter, ViewModel, Forms</tspan></text>
  <text x="270" y="367" font-size="12.5" font-weight="400" fill="#1D2733" text-anchor="start" class="mono"><tspan x="270" dy="0">persistence: SqlCaseGateway, CaseRecords, CaseRecordMapper</tspan></text>
  <text x="270" y="388" font-size="12.5" font-weight="400" fill="#1D2733" text-anchor="start" class="mono"><tspan x="270" dy="0">events: OutboxEventGateway, OutboxRelay · reference: ProfileTranslator</tspan></text>
  <rect x="250" y="450" width="620" height="120" rx="12" fill="#FBE7E1" stroke="#E07A5F" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="270" y="478" font-size="17" font-weight="800" fill="#9C3D24" text-anchor="start" class="mono"><tspan x="270" dy="0">screening-usecases</tspan></text>
  <text x="850" y="478" font-size="12.5" font-weight="700" fill="#9C3D24" text-anchor="end"><tspan x="850" dy="0">Ca 2 · Ce 1 · I 0.33 · A 0.38</tspan></text>
  <text x="270" y="506" font-size="12.5" font-weight="400" fill="#1D2733" text-anchor="start" class="mono"><tspan x="270" dy="0">opencase, screencase, resolvematch, closecase, viewcase, workqueue</tspan></text>
  <text x="270" y="527" font-size="12.5" font-weight="400" fill="#1D2733" text-anchor="start" class="mono"><tspan x="270" dy="0">shared: CaseOutputBoundary, CaseResponse, Outcomes, CaseLookup</tspan></text>
  <text x="270" y="548" font-size="12.5" font-weight="400" fill="#1D2733" text-anchor="start" class="mono"><tspan x="270" dy="0">gateway: CaseGateway, EventOutboxGateway, TransactionRunner, …</tspan></text>
  <rect x="250" y="610" width="620" height="120" rx="12" fill="#FDF4DA" stroke="#F2C14E" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="270" y="638" font-size="17" font-weight="800" fill="#8A6A12" text-anchor="start" class="mono"><tspan x="270" dy="0">screening-entities</tspan></text>
  <text x="850" y="638" font-size="12.5" font-weight="700" fill="#8A6A12" text-anchor="end"><tspan x="850" dy="0">Ca 3 · Ce 0 · I 0.00 · A 0.03</tspan></text>
  <text x="270" y="666" font-size="12.5" font-weight="400" fill="#1D2733" text-anchor="start" class="mono"><tspan x="270" dy="0">model: ScreeningCase, Match, PartyName, CaseId, …</tspan></text>
  <text x="270" y="687" font-size="12.5" font-weight="400" fill="#1D2733" text-anchor="start" class="mono"><tspan x="270" dy="0">policy: NameMatchingPolicy · event: sealed DomainEvent</tspan></text>
  <text x="270" y="708" font-size="12.5" font-weight="400" fill="#1D2733" text-anchor="start" class="mono"><tspan x="270" dy="0">no dependencies at all – plain Java 21</tspan></text>
  <line x1="560" y1="252" x2="560" y2="288" stroke="#1D2733" stroke-width="3" marker-end="url(#arrow-ink)"/>
  <line x1="560" y1="412" x2="560" y2="448" stroke="#1D2733" stroke-width="3" marker-end="url(#arrow-ink)"/>
  <line x1="560" y1="572" x2="560" y2="608" stroke="#1D2733" stroke-width="3" marker-end="url(#arrow-ink)"/>
  <path d="M 250 210 C 170 260, 170 470, 248 500" fill="none" stroke="#1D2733" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-ink)"/>
  <path d="M 250 190 C 120 260, 120 620, 248 660" fill="none" stroke="#1D2733" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-ink)"/>
  <path d="M 870 350 C 950 420, 950 600, 872 660" fill="none" stroke="#1D2733" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-ink)"/>
  <text x="92" y="400" font-size="12" font-weight="400" fill="#5B6B7F" text-anchor="middle"><tspan x="92" dy="0">app also</tspan><tspan x="92" dy="15.600000000000001">imports</tspan><tspan x="92" dy="15.600000000000001">both inner</tspan><tspan x="92" dy="15.600000000000001">modules</tspan></text>
  <text x="1000" y="520" font-size="12" font-weight="400" fill="#5B6B7F" text-anchor="middle"><tspan x="1000" dy="0">adapters use</tspan><tspan x="1000" dy="15.600000000000001">entities via</tspan><tspan x="1000" dy="15.600000000000001">usecases's</tspan><tspan x="1000" dy="15.600000000000001">transitive</tspan><tspan x="1000" dy="15.600000000000001">dependency</tspan></text>
  <rect x="930" y="130" width="310" height="120" rx="10" fill="#EEF2F6" stroke="#C9D3DE" stroke-width="1.5"/>
  <text x="946" y="156" font-size="14" font-weight="800" fill="#1F4E79" text-anchor="start"><tspan x="946" dy="0">External (ring 4 only)</tspan></text>
  <text x="946" y="180" font-size="12" font-weight="400" fill="#1D2733" text-anchor="start" class="mono"><tspan x="946" dy="0">micronaut-http-server-netty</tspan><tspan x="946" dy="17.4">micronaut-data-jdbc · flyway · h2</tspan><tspan x="946" dy="17.4">micronaut-serde-jackson · logback</tspan></text>
  <line x1="928" y1="190" x2="872" y2="190" stroke="#3E7CB1" stroke-width="2.5" marker-end="url(#arrow-fw)"/>
  <rect x="930" y="280" width="310" height="140" rx="8" fill="#FDF1DC" stroke="none" stroke-width="1.5"/>
  <text x="946" y="306" font-size="13" font-weight="400" fill="#1D2733" text-anchor="start"><tspan x="946" dy="0">Arrows go down the page and</tspan><tspan x="946" dy="18.849999999999998">never up: the graph is acyclic</tspan><tspan x="946" dy="18.849999999999998">(ADP) and points toward lower</tspan><tspan x="946" dy="18.849999999999998">instability (SDP). Try adding an</tspan><tspan x="946" dy="18.849999999999998">upward arrow in the component-</tspan><tspan x="946" dy="18.849999999999998">metrics simulator.</tspan></text>

</svg>
