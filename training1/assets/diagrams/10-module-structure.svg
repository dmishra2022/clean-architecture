  <text x="54" y="194" font-size="12" font-weight="400" fill="#1D2733" text-anchor="start" class="mono"><tspan x="54" dy="0">entities/</tspan><tspan x="54" dy="18.6">  DomainException</tspan><tspan x="54" dy="18.6">  model/</tspan><tspan x="54" dy="18.6">    ScreeningCase  Match</tspan><tspan x="54" dy="18.6">    CaseSnapshot  MatchSnapshot</tspan><tspan x="54" dy="18.6">    CaseId MatchId ClientGroupId</tspan><tspan x="54" dy="18.6">    AnalystId PartyName Party</tspan><tspan x="54" dy="18.6">    CountryCode EntityType</tspan><tspan x="54" dy="18.6">    MatchScore Resolution</tspan><tspan x="54" dy="18.6">    ResolutionRationale</tspan><tspan x="54" dy="18.6">    ReferenceProfile RiskCategory</tspan><tspan x="54" dy="18.6">    CaseStatus CaseOutcome</tspan><tspan x="54" dy="18.6">  policy/</tspan><tspan x="54" dy="18.6">    NameMatchingPolicy</tspan><tspan x="54" dy="18.6">    MatchEvaluation</tspan><tspan x="54" dy="18.6">  event/</tspan><tspan x="54" dy="18.6">    DomainEvent (sealed)</tspan><tspan x="54" dy="18.6">    CaseOpened CaseScreened</tspan><tspan x="54" dy="18.6">    MatchResolved CaseClosed</tspan></text>
