  <text x="356" y="194" font-size="12" font-weight="400" fill="#1D2733" text-anchor="start" class="mono"><tspan x="356" dy="0">usecases/</tspan><tspan x="356" dy="18.6">  opencase/</tspan><tspan x="356" dy="18.6">    OpenCase  OpenCaseRequest</tspan><tspan x="356" dy="18.6">    OpenCaseInteractor</tspan><tspan x="356" dy="18.6">  screencase/ resolvematch/</tspan><tspan x="356" dy="18.6">  closecase/ viewcase/</tspan><tspan x="356" dy="18.6">  workqueue/</tspan><tspan x="356" dy="18.6">    ListWorkQueueInteractor</tspan><tspan x="356" dy="18.6">    WorkQueueGateway …</tspan><tspan x="356" dy="18.6">  shared/</tspan><tspan x="356" dy="18.6">    CaseOutputBoundary</tspan><tspan x="356" dy="18.6">    CaseResponse  Outcomes</tspan><tspan x="356" dy="18.6">    CaseLookup  RequestValues</tspan><tspan x="356" dy="18.6">  gateway/</tspan><tspan x="356" dy="18.6">    CaseGateway</tspan><tspan x="356" dy="18.6">    ReferenceDataGateway</tspan><tspan x="356" dy="18.6">    EventOutboxGateway</tspan><tspan x="356" dy="18.6">    TransactionRunner</tspan><tspan x="356" dy="18.6">    IdempotencyGateway</tspan></text>
