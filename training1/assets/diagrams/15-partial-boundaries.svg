  <style>
    text { font-family: Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; white-space: pre; }
    .mono { font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace; }
  </style>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <text x="40" y="48" font-size="26" font-weight="800" fill="#1F3A5F" text-anchor="start"><tspan x="40" dy="0">Full and partial boundaries</tspan></text>
  <text x="40" y="76" font-size="15" font-weight="400" fill="#5B6B7F" text-anchor="start"><tspan x="40" dy="0">A full boundary costs interfaces, models and modules. Partial boundaries keep the option open for less.</tspan></text>
  <line x1="40" y1="92" x2="1240" y2="92" stroke="#C9D3DE" stroke-width="1"/>
  <rect x="40" y="116" width="590" height="270" rx="12" fill="#fff" stroke="#E07A5F" stroke-width="2.5"/>
  <rect x="40" y="116" width="590" height="42" rx="12" fill="#E07A5F" stroke="none" stroke-width="1.5"/>
  <text x="58" y="144" font-size="16" font-weight="800" fill="#fff" text-anchor="start"><tspan x="58" dy="0">Full boundary (the lab)</tspan></text>
  <text x="58" y="188" font-size="13.5" font-weight="400" fill="#1D2733" text-anchor="start"><tspan x="58" dy="0">Input + output boundary, request/response</tspan><tspan x="58" dy="20.25">models, gateways owned by ring 2, separate</tspan><tspan x="58" dy="20.25">Maven modules. Independently deployable</tspan><tspan x="58" dy="20.25">and testable. Most code, most safety.</tspan></text>
  <rect x="54" y="302" width="562" height="68" rx="8" fill="#EEF2F6" stroke="none" stroke-width="1.5"/>
  <text x="68" y="328" font-size="13" font-weight="600" fill="#1D2733" text-anchor="start"><tspan x="68" dy="0">Use for: the core domain, regulated rules,</tspan><tspan x="68" dy="18.849999999999998">anything several delivery mechanisms share.</tspan></text>
  <rect x="650" y="116" width="590" height="270" rx="12" fill="#fff" stroke="#2A9D8F" stroke-width="2.5"/>
  <rect x="650" y="116" width="590" height="42" rx="12" fill="#2A9D8F" stroke="none" stroke-width="1.5"/>
  <text x="668" y="144" font-size="16" font-weight="800" fill="#fff" text-anchor="start"><tspan x="668" dy="0">Skip the last step</tspan></text>
  <text x="668" y="188" font-size="13.5" font-weight="400" fill="#1D2733" text-anchor="start"><tspan x="668" dy="0">Same interfaces and models, but in one</tspan><tspan x="668" dy="20.25">module, separated by packages. Cheap to</tspan><tspan x="668" dy="20.25">split later; easy to erode without ArchUnit.</tspan></text>
  <rect x="664" y="302" width="562" height="68" rx="8" fill="#EEF2F6" stroke="none" stroke-width="1.5"/>
  <text x="678" y="328" font-size="13" font-weight="600" fill="#1D2733" text-anchor="start"><tspan x="678" dy="0">Use for: a new service whose boundaries</tspan><tspan x="678" dy="18.849999999999998">are still moving.</tspan></text>
  <rect x="40" y="406" width="590" height="270" rx="12" fill="#fff" stroke="#6D5BD0" stroke-width="2.5"/>
  <rect x="40" y="406" width="590" height="42" rx="12" fill="#6D5BD0" stroke="none" stroke-width="1.5"/>
  <text x="58" y="434" font-size="16" font-weight="800" fill="#fff" text-anchor="start"><tspan x="58" dy="0">One-dimensional boundary</tspan></text>
  <text x="58" y="478" font-size="13.5" font-weight="400" fill="#1D2733" text-anchor="start"><tspan x="58" dy="0">Only the Strategy half: a gateway interface</tspan><tspan x="58" dy="20.25">(e.g. ReferenceDataGateway) with no</tspan><tspan x="58" dy="20.25">reciprocal output boundary – callers get a</tspan><tspan x="58" dy="20.25">return value.</tspan></text>
  <rect x="54" y="592" width="562" height="68" rx="8" fill="#EEF2F6" stroke="none" stroke-width="1.5"/>
  <text x="68" y="618" font-size="13" font-weight="600" fill="#1D2733" text-anchor="start"><tspan x="68" dy="0">Use for: a seam you want for testing or</tspan><tspan x="68" dy="18.849999999999998">for one swap (in-memory vs HTTP).</tspan></text>
  <rect x="650" y="406" width="590" height="270" rx="12" fill="#fff" stroke="#5B6B7F" stroke-width="2.5"/>
  <rect x="650" y="406" width="590" height="42" rx="12" fill="#5B6B7F" stroke="none" stroke-width="1.5"/>
  <text x="668" y="434" font-size="16" font-weight="800" fill="#fff" text-anchor="start"><tspan x="668" dy="0">Facade</tspan></text>
  <text x="668" y="478" font-size="13.5" font-weight="400" fill="#1D2733" text-anchor="start"><tspan x="668" dy="0">One class exposes all use cases and calls</tspan><tspan x="668" dy="20.25">the services behind it. Clients still</tspan><tspan x="668" dy="20.25">depend transitively on everything behind</tspan><tspan x="668" dy="20.25">the facade.</tspan></text>
  <rect x="664" y="592" width="562" height="68" rx="8" fill="#EEF2F6" stroke="none" stroke-width="1.5"/>
  <text x="678" y="618" font-size="13" font-weight="600" fill="#1D2733" text-anchor="start"><tspan x="678" dy="0">Use for: a supporting subdomain where</tspan><tspan x="678" dy="18.849999999999998">the cost of a boundary is not repaid.</tspan></text>

</svg>
