  <text x="780" y="486.78" font-size="10.5" font-weight="500" fill="#1D2733" text-anchor="middle"><tspan x="780" dy="0">case.close(analyst, now)</tspan></text>
  <path d="M 918 526 h 26 v 14 h -24" fill="none" stroke="#F2C14E" stroke-width="1.8" marker-end="url(#arrow-ent)"/>
