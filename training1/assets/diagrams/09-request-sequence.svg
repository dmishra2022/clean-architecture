  <line x1="228" y1="798" x2="94" y2="798" stroke="#3E7CB1" stroke-width="2" marker-end="url(#arrow-fw)"/>
  <rect x="93" y="778" width="132" height="18" rx="9" fill="#fff" stroke="#C9D3DE" stroke-width="1"/>
  <text x="159" y="790.78" font-size="10.5" font-weight="500" fill="#1D2733" text-anchor="middle"><tspan x="159" dy="0">200 application/json</tspan></text>
  <rect x="40" y="830" width="1200" height="50" rx="8" fill="#FDF1DC" stroke="none" stroke-width="1.5"/>
  <text x="56" y="856" font-size="13" font-weight="400" fill="#1D2733" text-anchor="start"><tspan x="56" dy="0">Failure path: if close() throws DomainException(MATCHES_AWAITING_REVIEW), TransactionRunner rolls back, Outcomes calls presentRuleViolation and the client gets 422 – nothing is written.</tspan></text>

</svg>
