  <style>
    text { font-family: Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; white-space: pre; }
    .mono { font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace; }
  </style>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <text x="40" y="48" font-size="26" font-weight="800" fill="#1F3A5F" text-anchor="start"><tspan x="40" dy="0">A test suite per ring (79 tests in the lab)</tspan></text>
  <text x="40" y="76" font-size="15" font-weight="400" fill="#5B6B7F" text-anchor="start"><tspan x="40" dy="0">The further in, the cheaper each test and the fewer fakes it needs; the build itself tests the dependency rule</tspan></text>
  <line x1="40" y1="92" x2="1240" y2="92" stroke="#C9D3DE" stroke-width="1"/>
  <rect x="260" y="120" width="760" height="112" rx="12" fill="#E2EDF7" stroke="#3E7CB1" stroke-width="2.5"/>
  <text x="280" y="150" font-size="16" font-weight="800" fill="#1F4E79" text-anchor="start"><tspan x="280" dy="0">Ring 4 · screening-app · 14 tests</tspan></text>
  <text x="1000" y="150" font-size="15" font-weight="800" fill="#1F4E79" text-anchor="end"><tspan x="1000" dy="0">≈ 3 s</tspan></text>
  <text x="280" y="180" font-size="12.5" font-weight="400" fill="#1D2733" text-anchor="start" class="mono"><tspan x="280" dy="0">CaseApiTest (8) @MicronautTest + H2 · CleanArchitectureTest (6) ArchUnit</tspan></text>
  <text x="280" y="206" font-size="12.5" font-weight="400" fill="#5B6B7F" text-anchor="start"><tspan x="280" dy="0">real: Netty, Serde, Data JDBC, Flyway, H2</tspan></text>
  <rect x="190" y="250" width="900" height="112" rx="12" fill="#E6F3E4" stroke="#5FAD56" stroke-width="2.5"/>
  <text x="210" y="280" font-size="16" font-weight="800" fill="#2F6B28" text-anchor="start"><tspan x="210" dy="0">Ring 3 · interface adapters · 25 tests</tspan></text>
  <text x="1070" y="280" font-size="15" font-weight="800" fill="#2F6B28" text-anchor="end"><tspan x="1070" dy="0">&lt; 1 s</tspan></text>
  <text x="210" y="310" font-size="12.5" font-weight="400" fill="#1D2733" text-anchor="start" class="mono"><tspan x="210" dy="0">CasePresenterTest · CaseControllerTest · SqlCaseGatewayTest · OutboxTest · ReferenceDataTest</tspan></text>
  <text x="210" y="336" font-size="12.5" font-weight="400" fill="#5B6B7F" text-anchor="start"><tspan x="210" dy="0">fakes: InMemoryCaseRecords, InMemoryOutboxRecords; lambdas as boundaries</tspan></text>
  <rect x="120" y="380" width="1040" height="112" rx="12" fill="#FBE7E1" stroke="#E07A5F" stroke-width="2.5"/>
  <text x="140" y="410" font-size="16" font-weight="800" fill="#9C3D24" text-anchor="start"><tspan x="140" dy="0">Ring 2 · use cases · 13 tests</tspan></text>
  <text x="1140" y="410" font-size="15" font-weight="800" fill="#9C3D24" text-anchor="end"><tspan x="1140" dy="0">&lt; 0.5 s</tspan></text>
  <text x="140" y="440" font-size="12.5" font-weight="400" fill="#1D2733" text-anchor="start" class="mono"><tspan x="140" dy="0">CaseUseCasesTest · ListWorkQueueInteractorTest</tspan></text>
  <text x="140" y="466" font-size="12.5" font-weight="400" fill="#5B6B7F" text-anchor="start"><tspan x="140" dy="0">fakes: TestWorld gateways, TransactionRunner with rollback, RecordingPresenter</tspan></text>
  <rect x="50" y="510" width="1180" height="112" rx="12" fill="#FDF4DA" stroke="#F2C14E" stroke-width="2.5"/>
  <text x="70" y="540" font-size="16" font-weight="800" fill="#8A6A12" text-anchor="start"><tspan x="70" dy="0">Ring 1 · entities · 27 tests</tspan></text>
  <text x="1210" y="540" font-size="15" font-weight="800" fill="#8A6A12" text-anchor="end"><tspan x="1210" dy="0">&lt; 0.3 s</tspan></text>
  <text x="70" y="570" font-size="12.5" font-weight="400" fill="#1D2733" text-anchor="start" class="mono"><tspan x="70" dy="0">ScreeningCaseTest · NameMatchingPolicyTest</tspan></text>
  <text x="70" y="596" font-size="12.5" font-weight="400" fill="#5B6B7F" text-anchor="start"><tspan x="70" dy="0">nothing to fake: plain objects and a fixed clock</tspan></text>
  <rect x="40" y="650" width="1200" height="62" rx="10" fill="#ECE9FB" stroke="#6D5BD0" stroke-width="2"/>
  <text x="60" y="676" font-size="13.5" font-weight="400" fill="#1D2733" text-anchor="start"><tspan x="60" dy="0">The build is a test too: Maven module boundaries make "ring 1 imports Micronaut" a compile error;</tspan></text>
  <text x="60" y="698" font-size="13.5" font-weight="400" fill="#1D2733" text-anchor="start"><tspan x="60" dy="0">ArchUnit covers what the compiler cannot (adapters.web never touches entities, only app.config builds interactors).</tspan></text>

</svg>
