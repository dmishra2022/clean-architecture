  <style>
    text { font-family: Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; white-space: pre; }
    .mono { font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace; }
  </style>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <text x="40" y="48" font-size="26" font-weight="800" fill="#1F3A5F" text-anchor="start"><tspan x="40" dy="0">Ring 2: anatomy of one use case (ScreenCase)</tspan></text>
  <text x="40" y="76" font-size="15" font-weight="400" fill="#5B6B7F" text-anchor="start"><tspan x="40" dy="0">Each use case is a package with an input boundary, a request model and an interactor; shared types sit beside them</tspan></text>
  <line x1="40" y1="92" x2="1240" y2="92" stroke="#C9D3DE" stroke-width="1"/>
  <rect x="40" y="120" width="450" height="620" rx="18" fill="#FBE7E1" stroke="#E07A5F" stroke-width="2"/>
  <text x="54" y="142" font-size="13" font-weight="800" fill="#9C3D24" text-anchor="start"><tspan x="54" dy="0">screening-usecases</tspan></text>
  <text x="60" y="168" font-size="13" font-weight="400" fill="#1D2733" text-anchor="start" class="mono"><tspan x="60" dy="0">usecases/</tspan><tspan x="60" dy="20.8">  screencase/</tspan><tspan x="60" dy="20.8">    ScreenCase.java          «input boundary»</tspan><tspan x="60" dy="20.8">    ScreenCaseRequest.java   request model</tspan><tspan x="60" dy="20.8">    ScreenCaseInteractor.java</tspan><tspan x="60" dy="20.8">  opencase/ resolvematch/ closecase/</tspan><tspan x="60" dy="20.8">  viewcase/ workqueue/</tspan><tspan x="60" dy="20.8">  shared/</tspan><tspan x="60" dy="20.8">    CaseOutputBoundary.java  «output boundary»</tspan><tspan x="60" dy="20.8">    CaseResponse.java        response model</tspan><tspan x="60" dy="20.8">    Outcomes.java            failures → present*</tspan><tspan x="60" dy="20.8">    CaseLookup.java          tenant check</tspan><tspan x="60" dy="20.8">    CaseNotFoundException.java</tspan><tspan x="60" dy="20.8">    RequestValues.java</tspan><tspan x="60" dy="20.8">  gateway/</tspan><tspan x="60" dy="20.8">    CaseGateway.java</tspan><tspan x="60" dy="20.8">    ReferenceDataGateway.java</tspan><tspan x="60" dy="20.8">    EventOutboxGateway.java</tspan><tspan x="60" dy="20.8">    TransactionRunner.java</tspan><tspan x="60" dy="20.8">    IdempotencyGateway.java</tspan><tspan x="60" dy="20.8">    ConcurrentCaseUpdateException.java</tspan></text>
  <text x="530" y="140" font-size="17" font-weight="800" fill="#9C3D24" text-anchor="start" class="mono"><tspan x="530" dy="0">ScreenCaseInteractor.execute(request, presenter)</tspan></text>
  <rect x="530" y="160" width="710" height="62" rx="10" fill="#fff" stroke="#F2C14E" stroke-width="2"/>
  <circle cx="556" cy="191" r="15" fill="#F2C14E" stroke="none" stroke-width="0"/>
  <text x="556" y="196" font-size="14" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="556" dy="0">1</tspan></text>
  <text x="584" y="186" font-size="14.5" font-weight="700" fill="#1D2733" text-anchor="start"><tspan x="584" dy="0">Build value objects from the request</tspan></text>
  <text x="584" y="207" font-size="12.2" font-weight="400" fill="#5B6B7F" text-anchor="start" class="mono"><tspan x="584" dy="0">new ClientGroupId(…), CaseId.of(…) – invalid → INVALID_VALUE</tspan></text>
  <rect x="530" y="232" width="710" height="62" rx="10" fill="#fff" stroke="#E07A5F" stroke-width="2"/>
  <circle cx="556" cy="263" r="15" fill="#E07A5F" stroke="none" stroke-width="0"/>
  <text x="556" y="268" font-size="14" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="556" dy="0">2</tspan></text>
  <text x="584" y="258" font-size="14.5" font-weight="700" fill="#1D2733" text-anchor="start"><tspan x="584" dy="0">Read the party in a read transaction</tspan></text>
  <text x="584" y="279" font-size="12.2" font-weight="400" fill="#5B6B7F" text-anchor="start" class="mono"><tspan x="584" dy="0">transactions.read(() -&gt; CaseLookup.load(cases, group, id).party())</tspan></text>
  <rect x="530" y="304" width="710" height="62" rx="10" fill="#fff" stroke="#E07A5F" stroke-width="2"/>
  <circle cx="556" cy="335" r="15" fill="#E07A5F" stroke="none" stroke-width="0"/>
  <text x="556" y="340" font-size="14" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="556" dy="0">3</tspan></text>
  <text x="584" y="330" font-size="14.5" font-weight="700" fill="#1D2733" text-anchor="start"><tspan x="584" dy="0">Fetch candidates outside any write lock</tspan></text>
  <text x="584" y="351" font-size="12.2" font-weight="400" fill="#5B6B7F" text-anchor="start" class="mono"><tspan x="584" dy="0">referenceData.candidatesFor(party) – may be slow and remote</tspan></text>
  <rect x="530" y="376" width="710" height="62" rx="10" fill="#fff" stroke="#E07A5F" stroke-width="2"/>
  <circle cx="556" cy="407" r="15" fill="#E07A5F" stroke="none" stroke-width="0"/>
  <text x="556" y="412" font-size="14" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="556" dy="0">4</tspan></text>
  <text x="584" y="402" font-size="14.5" font-weight="700" fill="#1D2733" text-anchor="start"><tspan x="584" dy="0">Write transaction: load again, act, save</tspan></text>
  <text x="584" y="423" font-size="12.2" font-weight="400" fill="#5B6B7F" text-anchor="start" class="mono"><tspan x="584" dy="0">CaseLookup.load(…) → case.screen(candidates, policy, now)</tspan></text>
  <rect x="530" y="448" width="710" height="62" rx="10" fill="#fff" stroke="#F2C14E" stroke-width="2"/>
  <circle cx="556" cy="479" r="15" fill="#F2C14E" stroke="none" stroke-width="0"/>
  <text x="556" y="484" font-size="14" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="556" dy="0">5</tspan></text>
  <text x="584" y="474" font-size="14.5" font-weight="700" fill="#1D2733" text-anchor="start"><tspan x="584" dy="0">The entity enforces its invariants</tspan></text>
  <text x="584" y="495" font-size="12.2" font-weight="400" fill="#5B6B7F" text-anchor="start" class="mono"><tspan x="584" dy="0">CASE_CLOSED, one match per profile, derived status</tspan></text>
  <rect x="530" y="520" width="710" height="62" rx="10" fill="#fff" stroke="#E07A5F" stroke-width="2"/>
  <circle cx="556" cy="551" r="15" fill="#E07A5F" stroke="none" stroke-width="0"/>
  <text x="556" y="556" font-size="14" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="556" dy="0">6</tspan></text>
  <text x="584" y="546" font-size="14.5" font-weight="700" fill="#1D2733" text-anchor="start"><tspan x="584" dy="0">Persist state and events atomically</tspan></text>
  <text x="584" y="567" font-size="12.2" font-weight="400" fill="#5B6B7F" text-anchor="start" class="mono"><tspan x="584" dy="0">cases.save(case); outbox.append(case.pullEvents())</tspan></text>
  <rect x="530" y="592" width="710" height="62" rx="10" fill="#fff" stroke="#E07A5F" stroke-width="2"/>
  <circle cx="556" cy="623" r="15" fill="#E07A5F" stroke="none" stroke-width="0"/>
  <text x="556" y="628" font-size="14" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="556" dy="0">7</tspan></text>
  <text x="584" y="618" font-size="14.5" font-weight="700" fill="#1D2733" text-anchor="start"><tspan x="584" dy="0">Present the outcome after commit</tspan></text>
  <text x="584" y="639" font-size="12.2" font-weight="400" fill="#5B6B7F" text-anchor="start" class="mono"><tspan x="584" dy="0">presenter.presentCase(CaseResponse.from(case))</tspan></text>
  <rect x="530" y="664" width="710" height="62" rx="10" fill="#fff" stroke="#E07A5F" stroke-width="2"/>
  <circle cx="556" cy="695" r="15" fill="#E07A5F" stroke="none" stroke-width="0"/>
  <text x="556" y="700" font-size="14" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="556" dy="0">8</tspan></text>
  <text x="584" y="690" font-size="14.5" font-weight="700" fill="#1D2733" text-anchor="start"><tspan x="584" dy="0">Any failure is presented, not thrown</tspan></text>
  <text x="584" y="711" font-size="12.2" font-weight="400" fill="#5B6B7F" text-anchor="start" class="mono"><tspan x="584" dy="0">Outcomes.presentingFailures → presentRuleViolation / NotFound / Conflict</tspan></text>

</svg>
