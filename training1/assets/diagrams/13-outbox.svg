  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <text x="40" y="48" font-size="26" font-weight="800" fill="#1F3A5F" text-anchor="start"><tspan x="40" dy="0">Transactional outbox across the rings</tspan></text>
  <text x="40" y="76" font-size="15" font-weight="400" fill="#5B6B7F" text-anchor="start"><tspan x="40" dy="0">State and events commit together; a relay in ring 3, driven by a scheduler in ring 4, publishes them later</tspan></text>
  <line x1="40" y1="92" x2="1240" y2="92" stroke="#C9D3DE" stroke-width="1"/>
  <rect x="40" y="120" width="380" height="450" rx="18" fill="#FBE7E1" stroke="#E07A5F" stroke-width="2"/>
  <text x="54" y="142" font-size="13" font-weight="800" fill="#9C3D24" text-anchor="start"><tspan x="54" dy="0">USE CASES</tspan></text>
  <rect x="70" y="160" width="320" height="150" rx="10" fill="#fff" stroke="#E07A5F" stroke-width="2.2"/>
  <text x="84" y="195.8" font-size="14" font-weight="700" fill="#1D2733" text-anchor="start"><tspan x="84" dy="0">CloseCaseInteractor</tspan></text>
  <text x="84" y="213.3" font-size="12.5" font-weight="400" fill="#1D2733" text-anchor="start" class="mono" opacity="0.95"><tspan x="84" dy="0">transactions.write(() -&gt; {</tspan></text>
  <text x="84" y="230.8" font-size="12.5" font-weight="400" fill="#1D2733" text-anchor="start" class="mono" opacity="0.95"><tspan x="84" dy="0">  case.close(analyst, now);</tspan></text>
  <text x="84" y="248.3" font-size="12.5" font-weight="400" fill="#1D2733" text-anchor="start" class="mono" opacity="0.95"><tspan x="84" dy="0">  cases.save(case);</tspan></text>
  <text x="84" y="265.8" font-size="12.5" font-weight="400" fill="#1D2733" text-anchor="start" class="mono" opacity="0.95"><tspan x="84" dy="0">  outbox.append(case.pullEvents());</tspan></text>
  <text x="84" y="283.3" font-size="12.5" font-weight="400" fill="#1D2733" text-anchor="start" class="mono" opacity="0.95"><tspan x="84" dy="0">})</tspan></text>
  <rect x="70" y="340" width="150" height="56" rx="10" fill="#fff" stroke="#E07A5F" stroke-width="2.2" stroke-dasharray="6 4"/>
  <text x="145" y="372.0625" font-size="12.5" font-weight="700" fill="#1D2733" text-anchor="middle"><tspan x="145" dy="0">«CaseGateway»</tspan></text>
  <rect x="240" y="340" width="150" height="56" rx="10" fill="#fff" stroke="#E07A5F" stroke-width="2.2" stroke-dasharray="6 4"/>
  <text x="315" y="364.25" font-size="12.5" font-weight="700" fill="#1D2733" text-anchor="middle"><tspan x="315" dy="0">«EventOutbox</tspan><tspan x="315" dy="15.625">Gateway»</tspan></text>
  <rect x="70" y="420" width="320" height="56" rx="10" fill="#fff" stroke="#E07A5F" stroke-width="2.2" stroke-dasharray="6 4"/>
  <text x="230" y="452.0625" font-size="12.5" font-weight="700" fill="#1D2733" text-anchor="middle"><tspan x="230" dy="0">«TransactionRunner»</tspan></text>
  <text x="70" y="520" font-size="12.5" font-weight="400" fill="#9C3D24" text-anchor="start"><tspan x="70" dy="0">ring 2 says WHAT must be atomic;</tspan><tspan x="70" dy="18.125">it does not know there is a table.</tspan></text>
  <rect x="450" y="120" width="380" height="450" rx="18" fill="#E6F3E4" stroke="#5FAD56" stroke-width="2"/>
  <text x="464" y="142" font-size="13" font-weight="800" fill="#2F6B28" text-anchor="start"><tspan x="464" dy="0">INTERFACE ADAPTERS</tspan></text>
  <rect x="480" y="160" width="320" height="66" rx="10" fill="#fff" stroke="#5FAD56" stroke-width="2.2"/>
  <text x="640" y="189.5" font-size="14" font-weight="700" fill="#1D2733" text-anchor="middle"><tspan x="640" dy="0">SqlCaseGateway</tspan></text>
  <text x="640" y="205.6" font-size="11.5" font-weight="400" fill="#1D2733" text-anchor="middle" opacity="0.95"><tspan x="640" dy="0">UPDATE screening_case … AND version = ?</tspan></text>
  <rect x="480" y="246" width="320" height="66" rx="10" fill="#fff" stroke="#5FAD56" stroke-width="2.2"/>
  <text x="640" y="275.5" font-size="14" font-weight="700" fill="#1D2733" text-anchor="middle"><tspan x="640" dy="0">OutboxEventGateway + EventJson</tspan></text>
  <text x="640" y="291.6" font-size="11.5" font-weight="400" fill="#1D2733" text-anchor="middle" opacity="0.95"><tspan x="640" dy="0">INSERT outbox_event (published language v1)</tspan></text>
  <rect x="480" y="400" width="320" height="76" rx="10" fill="#fff" stroke="#5FAD56" stroke-width="2.2"/>
  <text x="640" y="426.45" font-size="14" font-weight="700" fill="#1D2733" text-anchor="middle"><tspan x="640" dy="0">OutboxRelay</tspan></text>
  <text x="640" y="442.55" font-size="11.5" font-weight="400" fill="#1D2733" text-anchor="middle" opacity="0.95"><tspan x="640" dy="0">publishPending(): oldest first, batch 100,</tspan></text>
  <text x="640" y="458.65000000000003" font-size="11.5" font-weight="400" fill="#1D2733" text-anchor="middle" opacity="0.95"><tspan x="640" dy="0">stop at the first failure (keeps order)</tspan></text>
  <line x1="392" y1="368" x2="478" y2="194" stroke="#5FAD56" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#hollow-ia)"/>
  <line x1="392" y1="368" x2="478" y2="280" stroke="#5FAD56" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#hollow-ia)"/>
  <rect x="860" y="120" width="380" height="450" rx="18" fill="#E2EDF7" stroke="#3E7CB1" stroke-width="2"/>
  <text x="874" y="142" font-size="13" font-weight="800" fill="#1F4E79" text-anchor="start"><tspan x="874" dy="0">FRAMEWORKS &amp; DRIVERS</tspan></text>
  <rect x="890" y="160" width="320" height="56" rx="10" fill="#fff" stroke="#3E7CB1" stroke-width="2.2"/>
  <text x="1050" y="192.3875" font-size="13.5" font-weight="700" fill="#1D2733" text-anchor="middle"><tspan x="1050" dy="0">MicronautTransactionRunner</tspan></text>
  <path d="M940,248 a110,12 0 0,0 220,0 v116 a110,12 0 0,1 -220,0 z" fill="#5B6B7F" filter="url(#shadow)"/>
  <ellipse cx="1050" cy="248" rx="110" ry="12" fill="#5B6B7F" stroke="#fff" stroke-opacity="0.5"/>
  <text x="1050" y="282" font-size="15" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="1050" dy="0">H2</tspan></text>
  <text x="1050" y="304" font-size="12" font-weight="400" fill="#fff" text-anchor="middle" class="mono"><tspan x="1050" dy="0">screening_case</tspan></text>
  <text x="1050" y="322" font-size="12" font-weight="400" fill="#fff" text-anchor="middle" class="mono"><tspan x="1050" dy="0">case_match</tspan></text>
  <text x="1050" y="340" font-size="12" font-weight="400" fill="#fff" text-anchor="middle" class="mono"><tspan x="1050" dy="0">outbox_event</tspan></text>
  <rect x="890" y="400" width="320" height="56" rx="10" fill="#fff" stroke="#3E7CB1" stroke-width="2.2"/>
  <text x="1050" y="432.225" font-size="13" font-weight="700" fill="#1D2733" text-anchor="middle"><tspan x="1050" dy="0">ScheduledOutboxRelay @Scheduled</tspan></text>
  <rect x="890" y="476" width="320" height="56" rx="10" fill="#fff" stroke="#3E7CB1" stroke-width="2.2"/>
  <text x="1050" y="508.225" font-size="13" font-weight="700" fill="#1D2733" text-anchor="middle"><tspan x="1050" dy="0">LoggingEventSink / KafkaEventSink</tspan></text>
  <line x1="802" y1="200" x2="938" y2="280" stroke="#3E7CB1" stroke-width="2.5" marker-end="url(#arrow-fw)"/>
  <line x1="802" y1="280" x2="938" y2="320" stroke="#3E7CB1" stroke-width="2.5" marker-end="url(#arrow-fw)"/>
  <line x1="888" y1="428" x2="802" y2="436" stroke="#3E7CB1" stroke-width="2.5" marker-end="url(#arrow-fw)"/>
  <path d="M 802 456 C 850 470, 860 500, 888 504" fill="none" stroke="#3E7CB1" stroke-width="2.5" marker-end="url(#arrow-fw)"/>
  <line x1="1050" y1="378" x2="802" y2="418" stroke="#5B6B7F" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrow-slate)"/>
  <rect x="40" y="600" width="1200" height="72" rx="8" fill="#FDF1DC" stroke="none" stroke-width="1.5"/>
  <text x="56" y="626" font-size="13" font-weight="400" fill="#1D2733" text-anchor="start"><tspan x="56" dy="0">Crash after COMMIT and before publish? The row is still in outbox_event; the next tick publishes it (delay, not loss).</tspan><tspan x="56" dy="18.849999999999998">Crash after publish and before marking? Published twice with the same eventId – consumers de-duplicate (idempotent consumer).</tspan></text>

</svg>
