  <text x="306" y="512.32" font-size="12" font-weight="600" fill="#1D2733" text-anchor="middle"><tspan x="306" dy="0">supporting</tspan></text>
  <text x="58" y="528" font-size="12" font-weight="400" fill="#5B6B7F" text-anchor="start"><tspan x="58" dy="0">its own service and its own rings</tspan></text>
