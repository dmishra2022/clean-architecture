  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <text x="40" y="48" font-size="26" font-weight="800" fill="#1F3A5F" text-anchor="start"><tspan x="40" dy="0">From subdomains to bounded contexts to rings</tspan></text>
  <text x="40" y="76" font-size="15" font-weight="400" fill="#5B6B7F" text-anchor="start"><tspan x="40" dy="0">Strategic DDD decides the boundaries between services; Clean Architecture organises the inside of each one</tspan></text>
  <line x1="40" y1="92" x2="1240" y2="92" stroke="#C9D3DE" stroke-width="1"/>
  <text x="40" y="130" font-size="16" font-weight="800" fill="#1F3A5F" text-anchor="start"><tspan x="40" dy="0">Subdomains → bounded contexts</tspan></text>
  <rect x="40" y="148" width="330" height="68" rx="10" fill="#FDF1DC" stroke="#1F3A5F" stroke-width="3"/>
  <text x="58" y="178" font-size="15" font-weight="700" fill="#1D2733" text-anchor="start"><tspan x="58" dy="0">Screening &amp; Case</tspan></text>
  <rect x="258" y="166" width="96" height="28" rx="14" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.8"/>
  <text x="306" y="184.32" font-size="12" font-weight="600" fill="#1D2733" text-anchor="middle"><tspan x="306" dy="0">core</tspan></text>
  <text x="58" y="200" font-size="12" font-weight="400" fill="#5B6B7F" text-anchor="start"><tspan x="58" dy="0">this course – zoomed in on the right</tspan></text>
  <rect x="40" y="230" width="330" height="68" rx="10" fill="#fff" stroke="#1F3A5F" stroke-width="1.8"/>
  <text x="58" y="260" font-size="15" font-weight="700" fill="#1D2733" text-anchor="start"><tspan x="58" dy="0">Risk Intelligence Data</tspan></text>
  <rect x="258" y="248" width="96" height="28" rx="14" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.8"/>
  <text x="306" y="266.32" font-size="12" font-weight="600" fill="#1D2733" text-anchor="middle"><tspan x="306" dy="0">core</tspan></text>
  <text x="58" y="282" font-size="12" font-weight="400" fill="#5B6B7F" text-anchor="start"><tspan x="58" dy="0">its own service and its own rings</tspan></text>
  <rect x="40" y="312" width="330" height="68" rx="10" fill="#fff" stroke="#1F3A5F" stroke-width="1.8"/>
  <text x="58" y="342" font-size="15" font-weight="700" fill="#1D2733" text-anchor="start"><tspan x="58" dy="0">Ongoing Monitoring</tspan></text>
  <rect x="258" y="330" width="96" height="28" rx="14" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.8"/>
  <text x="306" y="348.32" font-size="12" font-weight="600" fill="#1D2733" text-anchor="middle"><tspan x="306" dy="0">core</tspan></text>
  <text x="58" y="364" font-size="12" font-weight="400" fill="#5B6B7F" text-anchor="start"><tspan x="58" dy="0">its own service and its own rings</tspan></text>
  <rect x="40" y="394" width="330" height="68" rx="10" fill="#fff" stroke="#2A9D8F" stroke-width="1.8"/>
  <text x="58" y="424" font-size="15" font-weight="700" fill="#1D2733" text-anchor="start"><tspan x="58" dy="0">Client &amp; Entitlements</tspan></text>
  <rect x="258" y="412" width="96" height="28" rx="14" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="1.8"/>
  <text x="306" y="430.32" font-size="12" font-weight="600" fill="#1D2733" text-anchor="middle"><tspan x="306" dy="0">supporting</tspan></text>
  <text x="58" y="446" font-size="12" font-weight="400" fill="#5B6B7F" text-anchor="start"><tspan x="58" dy="0">its own service and its own rings</tspan></text>
  <rect x="40" y="476" width="330" height="68" rx="10" fill="#fff" stroke="#2A9D8F" stroke-width="1.8"/>
  <text x="58" y="506" font-size="15" font-weight="700" fill="#1D2733" text-anchor="start"><tspan x="58" dy="0">Audit &amp; Reporting</tspan></text>
