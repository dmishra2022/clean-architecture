  <text x="850" y="312" font-size="13" font-weight="400" fill="#1D2733" text-anchor="middle" class="mono"><tspan x="850" dy="0">ScreeningCase · Match · PartyName · NameMatchingPolicy</tspan></text>
  <text x="850" y="338" font-size="12.5" font-weight="400" fill="#8A6A12" text-anchor="middle" font-style="italic"><tspan x="850" dy="0">the ubiquitous language of the Screening context</tspan></text>
  <text x="850" y="410" font-size="12.5" font-weight="400" fill="#1D2733" text-anchor="middle" class="mono"><tspan x="850" dy="0">OpenCase · ScreenCase · ResolveMatch · CloseCase · ViewCase · ListWorkQueue</tspan></text>
  <text x="850" y="434" font-size="12.5" font-weight="400" fill="#1D2733" text-anchor="middle" class="mono"><tspan x="850" dy="0">CaseGateway · ReferenceDataGateway · EventOutboxGateway</tspan></text>
  <text x="850" y="474" font-size="12.5" font-weight="400" fill="#9C3D24" text-anchor="middle" font-style="italic"><tspan x="850" dy="0">one package per use case – the architecture screams "screening"</tspan></text>
  <rect x="510" y="530" width="220" height="96" rx="10" fill="#fff" stroke="#5FAD56" stroke-width="2"/>
  <text x="620" y="560" font-size="14" font-weight="800" fill="#2F6B28" text-anchor="middle"><tspan x="620" dy="0">Open Host Service</tspan></text>
  <text x="620" y="586" font-size="12" font-weight="400" fill="#1D2733" text-anchor="middle" class="mono"><tspan x="620" dy="0">CaseController</tspan><tspan x="620" dy="16.799999999999997">CasePresenter</tspan><tspan x="620" dy="16.799999999999997">CaseJson</tspan></text>
  <rect x="750" y="530" width="220" height="96" rx="10" fill="#fff" stroke="#5FAD56" stroke-width="2"/>
  <text x="860" y="560" font-size="14" font-weight="800" fill="#2F6B28" text-anchor="middle"><tspan x="860" dy="0">Anti-corruption layer</tspan></text>
  <text x="860" y="586" font-size="12" font-weight="400" fill="#1D2733" text-anchor="middle" class="mono"><tspan x="860" dy="0">ProfileTranslator</tspan><tspan x="860" dy="16.799999999999997">RemoteReferenceData</tspan></text>
  <rect x="990" y="530" width="220" height="96" rx="10" fill="#fff" stroke="#5FAD56" stroke-width="2"/>
  <text x="1100" y="560" font-size="14" font-weight="800" fill="#2F6B28" text-anchor="middle"><tspan x="1100" dy="0">Published language</tspan></text>
  <text x="1100" y="586" font-size="12" font-weight="400" fill="#1D2733" text-anchor="middle" class="mono"><tspan x="1100" dy="0">EventJson v1</tspan><tspan x="1100" dy="16.799999999999997">OutboxRelay</tspan></text>
  <text x="850" y="690" font-size="12.5" font-weight="400" fill="#1F4E79" text-anchor="middle" class="mono"><tspan x="850" dy="0">CaseEndpoint (HTTP) · MicronautReferenceDataClient (@Client) · LoggingEventSink · H2 · MainWiring</tspan></text>

