  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <text x="40" y="48" font-size="26" font-weight="800" fill="#1F3A5F" text-anchor="start"><tspan x="40" dy="0">Component principles and the main sequence</tspan></text>
  <text x="40" y="76" font-size="15" font-weight="400" fill="#5B6B7F" text-anchor="start"><tspan x="40" dy="0">Cohesion decides what goes in a module; coupling decides how modules may depend on each other</tspan></text>
  <line x1="40" y1="92" x2="1240" y2="92" stroke="#C9D3DE" stroke-width="1"/>
  <rect x="40" y="120" width="285" height="136" rx="10" fill="#fff" stroke="#2A9D8F" stroke-width="2"/>
  <rect x="40" y="120" width="285" height="34" rx="10" fill="#2A9D8F" stroke="none" stroke-width="1.5"/>
  <text x="54" y="143" font-size="14.5" font-weight="800" fill="#fff" text-anchor="start"><tspan x="54" dy="0">REP · Reuse/Release Equivalence</tspan></text>
  <text x="54" y="182" font-size="13" font-weight="400" fill="#1D2733" text-anchor="start"><tspan x="54" dy="0">What you release together must make</tspan><tspan x="54" dy="18.849999999999998">sense together (one version, one jar).</tspan></text>
  <rect x="340" y="120" width="285" height="136" rx="10" fill="#fff" stroke="#2A9D8F" stroke-width="2"/>
  <rect x="340" y="120" width="285" height="34" rx="10" fill="#2A9D8F" stroke="none" stroke-width="1.5"/>
  <text x="354" y="143" font-size="14.5" font-weight="800" fill="#fff" text-anchor="start"><tspan x="354" dy="0">CCP · Common Closure</tspan></text>
  <text x="354" y="182" font-size="13" font-weight="400" fill="#1D2733" text-anchor="start"><tspan x="354" dy="0">Gather what changes for the same reason</tspan><tspan x="354" dy="18.849999999999998">(SRP for components).</tspan></text>
  <rect x="40" y="270" width="285" height="136" rx="10" fill="#fff" stroke="#2A9D8F" stroke-width="2"/>
  <rect x="40" y="270" width="285" height="34" rx="10" fill="#2A9D8F" stroke="none" stroke-width="1.5"/>
  <text x="54" y="293" font-size="14.5" font-weight="800" fill="#fff" text-anchor="start"><tspan x="54" dy="0">CRP · Common Reuse</tspan></text>
  <text x="54" y="332" font-size="13" font-weight="400" fill="#1D2733" text-anchor="start"><tspan x="54" dy="0">Don't force users to depend on classes</tspan><tspan x="54" dy="18.849999999999998">they don't use (ISP for components).</tspan></text>
  <rect x="340" y="270" width="285" height="136" rx="10" fill="#fff" stroke="#E07A5F" stroke-width="2"/>
  <rect x="340" y="270" width="285" height="34" rx="10" fill="#E07A5F" stroke="none" stroke-width="1.5"/>
  <text x="354" y="293" font-size="14.5" font-weight="800" fill="#fff" text-anchor="start"><tspan x="354" dy="0">ADP · Acyclic Dependencies</tspan></text>
  <text x="354" y="332" font-size="13" font-weight="400" fill="#1D2733" text-anchor="start"><tspan x="354" dy="0">No cycles in the module graph. Maven</tspan><tspan x="354" dy="18.849999999999998">rejects them for you.</tspan></text>
  <rect x="40" y="420" width="285" height="136" rx="10" fill="#fff" stroke="#E07A5F" stroke-width="2"/>
  <rect x="40" y="420" width="285" height="34" rx="10" fill="#E07A5F" stroke="none" stroke-width="1.5"/>
  <text x="54" y="443" font-size="14.5" font-weight="800" fill="#fff" text-anchor="start"><tspan x="54" dy="0">SDP · Stable Dependencies</tspan></text>
  <text x="54" y="482" font-size="13" font-weight="400" fill="#1D2733" text-anchor="start"><tspan x="54" dy="0">Depend in the direction of stability:</tspan><tspan x="54" dy="18.849999999999998">toward lower instability I.</tspan></text>
  <rect x="340" y="420" width="285" height="136" rx="10" fill="#fff" stroke="#E07A5F" stroke-width="2"/>
  <rect x="340" y="420" width="285" height="34" rx="10" fill="#E07A5F" stroke="none" stroke-width="1.5"/>
  <text x="354" y="443" font-size="14.5" font-weight="800" fill="#fff" text-anchor="start"><tspan x="354" dy="0">SAP · Stable Abstractions</tspan></text>
  <text x="354" y="482" font-size="13" font-weight="400" fill="#1D2733" text-anchor="start"><tspan x="354" dy="0">A stable module should be abstract so</tspan><tspan x="354" dy="18.849999999999998">it can be extended without change.</tspan></text>
  <text x="40" y="590" font-size="13.5" font-weight="400" fill="#5B6B7F" text-anchor="start"><tspan x="40" dy="0">Cohesion principles (teal) pull toward small, focused modules.</tspan><tspan x="40" dy="19.575">Coupling principles (orange) constrain the arrows between them.</tspan></text>
  <rect x="40" y="640" width="585" height="92" rx="8" fill="#EEF2F6" stroke="none" stroke-width="1.5"/>
  <text x="56" y="666" font-size="13.5" font-weight="400" fill="#1D2733" text-anchor="start"><tspan x="56" dy="0">I = Ce / (Ca + Ce)   A = abstract types / all types   D = |A + I − 1|</tspan><tspan x="56" dy="19.575">Ca = modules that depend on me · Ce = modules I depend on</tspan></text>
  <rect x="700" y="130" width="520" height="520" rx="0" fill="#F7F9FB" stroke="#C9D3DE" stroke-width="1.5"/>
  <path d="M 700 650 L 700 468 A 182 182 0 0 0 882 650 Z" fill="rgba(200,85,61,.12)" stroke="#C8553D" stroke-width="0"/>
  <path d="M 1220 130 L 1220 312 A 182 182 0 0 1 1038 130 Z" fill="rgba(91,107,127,.12)" stroke="#5B6B7F" stroke-width="0"/>
  <line x1="700" y1="130" x2="1220" y2="650" stroke="#2A9D8F" stroke-width="2.5" stroke-dasharray="8 5"/>
  <text x="991.2" y="384" font-size="13" font-weight="700" fill="#2A9D8F" text-anchor="start"><tspan x="991.2" dy="0">main sequence</tspan></text>
  <text x="715.6" y="535.6" font-size="13" font-weight="700" fill="#C8553D" text-anchor="start"><tspan x="715.6" dy="0">zone of pain</tspan></text>
  <text x="1209.6" y="150.8" font-size="13" font-weight="700" fill="#5B6B7F" text-anchor="end"><tspan x="1209.6" dy="0">zone of uselessness</tspan></text>
  <text x="960" y="686" font-size="13.5" font-weight="400" fill="#1D2733" text-anchor="middle"><tspan x="960" dy="0">Instability I →</tspan></text>
  <text x="678" y="390" font-size="13.5" text-anchor="middle" transform="rotate(-90 678 390)" fill="#1D2733">Abstractness A →</text>
  <circle cx="700" cy="632.0689655172414" r="11" fill="#F2C14E" stroke="#1D2733" stroke-width="1.5"/>
  <text x="716" y="618.0689655172414" font-size="12" font-weight="700" fill="#1D2733" text-anchor="start"><tspan x="716" dy="0">entities  I=0.00 A=0.03 D=0.97</tspan></text>
  <circle cx="873.3333333333333" cy="453.2432432432432" r="11" fill="#E07A5F" stroke="#1D2733" stroke-width="1.5"/>
  <text x="889.3333333333333" y="439.2432432432432" font-size="12" font-weight="700" fill="#1D2733" text-anchor="start"><tspan x="889.3333333333333" dy="0">usecases  I=0.33 A=0.38 D=0.29</tspan></text>
  <circle cx="1046.6666666666665" cy="585" r="11" fill="#5FAD56" stroke="#1D2733" stroke-width="1.5"/>
  <text x="1030.6666666666665" y="571" font-size="12" font-weight="700" fill="#1D2733" text-anchor="end"><tspan x="1030.6666666666665" dy="0">adapters  I=0.67 A=0.13 D=0.21</tspan></text>
  <circle cx="1220" cy="546" r="11" fill="#3E7CB1" stroke="#1D2733" stroke-width="1.5"/>
  <text x="1204" y="532" font-size="12" font-weight="700" fill="#1D2733" text-anchor="end"><tspan x="1204" dy="0">app  I=1.00 A=0.20 D=0.20</tspan></text>

</svg>
