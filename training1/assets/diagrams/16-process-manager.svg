  <style>
    text { font-family: Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; white-space: pre; }
    .mono { font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace; }
  </style>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <text x="40" y="48" font-size="26" font-weight="800" fill="#1F3A5F" text-anchor="start"><tspan x="40" dy="0">Ongoing monitoring: a process manager between two Clean services</tspan></text>
  <text x="40" y="76" font-size="15" font-weight="400" fill="#5B6B7F" text-anchor="start"><tspan x="40" dy="0">Each service keeps its own rings; they meet only through published events and gateway calls</tspan></text>
  <line x1="40" y1="92" x2="1240" y2="92" stroke="#C9D3DE" stroke-width="1"/>
  <rect x="40" y="120" width="560" height="520" rx="18" fill="#E2EDF7" stroke="#3E7CB1" stroke-width="2"/>
  <text x="54" y="142" font-size="14" font-weight="800" fill="#1F4E79" text-anchor="start"><tspan x="54" dy="0">monitoring-service</tspan></text>
  <rect x="60" y="160" width="520" height="380" rx="18" fill="#E6F3E4" stroke="#5FAD56" stroke-width="2"/>
  <text x="74" y="182" font-size="12" font-weight="800" fill="#2F6B28" text-anchor="start"><tspan x="74" dy="0">adapters: event listener, ScreeningClientGateway</tspan></text>
  <rect x="80" y="200" width="480" height="240" rx="18" fill="#FBE7E1" stroke="#E07A5F" stroke-width="2"/>
  <text x="94" y="222" font-size="12" font-weight="800" fill="#9C3D24" text-anchor="start"><tspan x="94" dy="0">use case: RescreenOnProfileUpdate (process manager)</tspan></text>
  <rect x="100" y="240" width="440" height="80" rx="10" fill="#fff" stroke="#E07A5F" stroke-width="2.2"/>
  <text x="320" y="267.75" font-size="14" font-weight="700" fill="#1D2733" text-anchor="middle"><tspan x="320" dy="0">RescreenOnProfileUpdateInteractor</tspan></text>
  <text x="320" y="284.55" font-size="12" font-weight="400" fill="#1D2733" text-anchor="middle" opacity="0.95"><tspan x="320" dy="0">inbox dedupe → find watched cases → for each:</tspan></text>
  <text x="320" y="301.35" font-size="12" font-weight="400" fill="#1D2733" text-anchor="middle" opacity="0.95"><tspan x="320" dy="0">screening.rescreen(caseId) → record progress</tspan></text>
  <rect x="100" y="340" width="210" height="76" rx="10" fill="#fff" stroke="#F2C14E" stroke-width="2.2"/>
  <text x="205" y="366.45" font-size="14" font-weight="700" fill="#1D2733" text-anchor="middle"><tspan x="205" dy="0">RescreenRun</tspan></text>
  <text x="205" y="382.55" font-size="11.5" font-weight="400" fill="#1D2733" text-anchor="middle" opacity="0.95"><tspan x="205" dy="0">entity: pending, done,</tspan></text>
  <text x="205" y="398.65000000000003" font-size="11.5" font-weight="400" fill="#1D2733" text-anchor="middle" opacity="0.95"><tspan x="205" dy="0">failed case ids</tspan></text>
  <rect x="330" y="340" width="210" height="76" rx="10" fill="#fff" stroke="#E07A5F" stroke-width="2.2" stroke-dasharray="6 4"/>
  <text x="435" y="374.5" font-size="14" font-weight="700" fill="#1D2733" text-anchor="middle"><tspan x="435" dy="0">«ScreeningGateway»</tspan></text>
  <text x="435" y="390.6" font-size="11.5" font-weight="400" fill="#1D2733" text-anchor="middle" opacity="0.95"><tspan x="435" dy="0">rescreen(caseId)</tspan></text>
  <rect x="80" y="560" width="230" height="60" rx="10" fill="#fff" stroke="#3E7CB1" stroke-width="2.2"/>
  <text x="195" y="586.5" font-size="14" font-weight="700" fill="#1D2733" text-anchor="middle"><tspan x="195" dy="0">Kafka listener</tspan></text>
  <text x="195" y="602.6" font-size="11.5" font-weight="400" fill="#1D2733" text-anchor="middle" opacity="0.95"><tspan x="195" dy="0">ProfileUpdated v3</tspan></text>
  <rect x="330" y="560" width="250" height="60" rx="10" fill="#fff" stroke="#3E7CB1" stroke-width="2.2"/>
  <text x="455" y="594.225" font-size="13" font-weight="700" fill="#1D2733" text-anchor="middle"><tspan x="455" dy="0">HTTP client / command topic</tspan></text>
  <rect x="680" y="120" width="560" height="520" rx="18" fill="#E2EDF7" stroke="#3E7CB1" stroke-width="2"/>
  <text x="694" y="142" font-size="14" font-weight="800" fill="#1F4E79" text-anchor="start"><tspan x="694" dy="0">screening-case-service-clean</tspan></text>
  <rect x="700" y="160" width="520" height="380" rx="18" fill="#E6F3E4" stroke="#5FAD56" stroke-width="2"/>
  <text x="714" y="182" font-size="12" font-weight="800" fill="#2F6B28" text-anchor="start"><tspan x="714" dy="0">adapters: CaseController (or command listener)</tspan></text>
  <rect x="720" y="200" width="480" height="240" rx="18" fill="#FBE7E1" stroke="#E07A5F" stroke-width="2"/>
  <text x="734" y="222" font-size="12" font-weight="800" fill="#9C3D24" text-anchor="start"><tspan x="734" dy="0">use case: ScreenCase (the same interactor)</tspan></text>
  <rect x="740" y="240" width="440" height="80" rx="10" fill="#fff" stroke="#E07A5F" stroke-width="2.2"/>
  <text x="960" y="267.75" font-size="14" font-weight="700" fill="#1D2733" text-anchor="middle"><tspan x="960" dy="0">ScreenCaseInteractor</tspan></text>
  <text x="960" y="284.55" font-size="12" font-weight="400" fill="#1D2733" text-anchor="middle" opacity="0.95"><tspan x="960" dy="0">candidates outside the write transaction,</tspan></text>
  <text x="960" y="301.35" font-size="12" font-weight="400" fill="#1D2733" text-anchor="middle" opacity="0.95"><tspan x="960" dy="0">save + outbox in one transaction</tspan></text>
  <rect x="740" y="340" width="440" height="76" rx="10" fill="#fff" stroke="#F2C14E" stroke-width="2.2"/>
  <text x="960" y="366.45" font-size="14" font-weight="700" fill="#1D2733" text-anchor="middle"><tspan x="960" dy="0">ScreeningCase</tspan></text>
  <text x="960" y="382.55" font-size="11.5" font-weight="400" fill="#1D2733" text-anchor="middle" opacity="0.95"><tspan x="960" dy="0">invariant: CASE_CLOSED – a closed case is never</tspan></text>
  <text x="960" y="398.65000000000003" font-size="11.5" font-weight="400" fill="#1D2733" text-anchor="middle" opacity="0.95"><tspan x="960" dy="0">rescreened; the process manager decides what to do</tspan></text>
  <rect x="720" y="560" width="230" height="60" rx="10" fill="#fff" stroke="#3E7CB1" stroke-width="2.2"/>
  <text x="835" y="594.225" font-size="13" font-weight="700" fill="#1D2733" text-anchor="middle"><tspan x="835" dy="0">CaseEndpoint</tspan></text>
  <rect x="970" y="560" width="250" height="60" rx="10" fill="#fff" stroke="#3E7CB1" stroke-width="2.2"/>
  <text x="1095" y="586.5" font-size="14" font-weight="700" fill="#1D2733" text-anchor="middle"><tspan x="1095" dy="0">OutboxRelay → sink</tspan></text>
  <text x="1095" y="602.6" font-size="11.5" font-weight="400" fill="#1D2733" text-anchor="middle" opacity="0.95"><tspan x="1095" dy="0">CaseScreened{newMatches}</tspan></text>
  <line x1="580" y1="590" x2="718" y2="590" stroke="#1D2733" stroke-width="2.5" marker-end="url(#arrow-ink)"/>
  <rect x="602" y="562" width="94" height="20" rx="10" fill="#fff" stroke="#C9D3DE" stroke-width="1"/>
  <text x="649" y="576.14" font-size="11.5" font-weight="600" fill="#1D2733" text-anchor="middle"><tspan x="649" dy="0">RescreenCase</tspan></text>
  <path d="M 1095 622 C 1095 690, 195 690, 195 622" fill="none" stroke="#6D5BD0" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#arrow-purple)"/>
  <rect x="485" y="666" width="320" height="20" rx="10" fill="#fff" stroke="#6D5BD0" stroke-width="1"/>
  <text x="645" y="680.32" font-size="12" font-weight="600" fill="#1D2733" text-anchor="middle"><tspan x="645" dy="0">CaseScreened event → alert if newMatches &gt; 0</tspan></text>
  <path d="M 110 558 C 60 500, 60 300, 98 282" fill="none" stroke="#1D2733" stroke-width="2" marker-end="url(#arrow-ink)"/>
  <line x1="435" y1="418" x2="455" y2="556" stroke="#1D2733" stroke-width="2" marker-end="url(#arrow-ink)"/>

</svg>
